<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eslem'in Ağacı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px 0; overflow-y: auto;
    background: rgba(2, 5, 14, 0.36); backdrop-filter: blur(3px);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; z-index: 10;
    transition: opacity .85s ease;
  }
  #gate.hide { opacity: 0; pointer-events: none; }
  #box {
    width: min(420px, 88vw); padding: 34px 30px 26px; text-align: center; color: #eef3ff;
    background: rgba(10, 18, 36, .62); border: 1px solid rgba(255, 224, 150, .2);
    border-radius: 20px; backdrop-filter: blur(14px);
    box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 50px rgba(255,205,95,.1), inset 0 1px 0 rgba(255,255,255,.12);
  }
  #hud {
    position: fixed; top: calc(min(3.2vh, 28px) + 14px); right: 20px; z-index: 6; display: flex; gap: 6px;
    padding: 5px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(16, 26, 48, .52), rgba(6, 11, 24, .62));
    border: 1px solid rgba(244, 206, 120, .26);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 242, 205, .18);
    backdrop-filter: blur(16px) saturate(140%);
    opacity: 0; pointer-events: none; transition: opacity .9s ease;
  }
  #hud.show { opacity: 1; pointer-events: auto; }
  .bar {
    position: fixed; left: 0; right: 0; height: min(3.2vh, 28px); background: #010205; z-index: 5;
    pointer-events: none; transition: transform 1.2s cubic-bezier(.22,1,.36,1);
  }
  .bar.top { top: 0; transform: translateY(-100%); border-bottom: 1px solid rgba(255,220,140,.08); }
  .bar.bot { bottom: 0; transform: translateY(100%); border-top: 1px solid rgba(255,220,140,.08); }
  body.cinema .bar { transform: translateY(0); }
  #hud button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px;
    border: 1px solid rgba(244, 206, 120, .2);
    background: linear-gradient(180deg, rgba(255, 240, 200, .07), rgba(255, 240, 200, .02));
    color: #f4e6c6; font-size: 11.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase;
    font-family: "Cinzel", Georgia, serif; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 245, 215, .16);
    transition: all .25s ease;
  }
  #hud button svg { width: 14px; height: 14px; stroke: #f2cb72; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  #hud button:hover {
    background: linear-gradient(180deg, rgba(245, 205, 110, .22), rgba(205, 150, 45, .12));
    border-color: rgba(255, 224, 145, .62); color: #fff6dc;
    box-shadow: 0 0 18px rgba(245, 200, 95, .28), inset 0 1px 0 rgba(255, 250, 225, .35);
    transform: translateY(-1px);
  }
  @media (max-width: 640px) {
    #hud { left: 50%; right: auto; transform: translateX(-50%); top: calc(min(3.2vh, 24px) + 10px); gap: 4px; padding: 4px; }
    #hud button { padding: 6px 10px; font-size: 10.5px; letter-spacing: .06em; }
    #ctaBtn { padding: 10px 20px; font-size: 11.5px; }
  }
  #titleOverlay {
    position: fixed; z-index: 6; display: flex; flex-direction: column; align-items: center; text-align: center;
    pointer-events: none; opacity: 0; transform: translateY(14px);
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.22,1,.36,1);
    padding: 0 16px; box-sizing: border-box;
  }
  #titleOverlay.show { opacity: 1; transform: translateY(0); }
  #titleOverlay.side { transform: translateY(calc(-50% + 14px)); }
  #titleOverlay.side.show { transform: translateY(-50%); }
  .tRule {
    width: min(170px, 44vw); height: 1px; position: relative;
    background: linear-gradient(90deg, transparent, rgba(245, 206, 115, .85), transparent);
  }
  .tRule.top { margin-bottom: 14px; }
  .tRule.top::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px;
    background: #ffeeb9; transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 0 10px rgba(255, 224, 145, .9);
  }
  .tRule.bot { margin: 14px 0 20px; width: min(140px, 36vw); }
  .tName {
    font-family: "Playfair Display", "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 700; line-height: 1.08;
    font-size: clamp(32px, 4.4vw, 60px);
    background: linear-gradient(125deg, #fff9e6 0%, #f6ca64 38%, #fff0be 68%, #c48a24 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 205, 95, .52));
  }
  .tSub {
    margin-top: 8px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 600; line-height: 1.28; letter-spacing: .04em;
    font-size: clamp(18px, 2vw, 27px); color: #fbf0d9;
    text-shadow: 0 0 14px rgba(255, 224, 150, .55), 0 1px 6px rgba(0, 0, 0, .65);
  }
  #titleOverlay.bottom .tName { font-size: clamp(24px, 7.2vw, 38px); }
  #titleOverlay.bottom .tSub { font-size: clamp(16px, 4.6vw, 22px); margin-top: 4px; }
  #titleOverlay.bottom .tRule.top { margin-bottom: 8px; }
  #titleOverlay.bottom .tRule.bot { margin: 10px 0 14px; }
  #ctaBtn {
    position: relative; pointer-events: auto;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 24px; border-radius: 999px; cursor: pointer;
    font-family: "Cinzel", Georgia, serif; font-size: 12.5px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: #fff5d8;
    background: linear-gradient(135deg, rgba(244, 198, 92, .22), rgba(165, 112, 24, .28));
    border: 1px solid rgba(252, 218, 132, .58);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .48), 0 0 24px rgba(245, 198, 92, .24), inset 0 1px 0 rgba(255, 248, 220, .38);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
    overflow: hidden;
  }
  #ctaBtn::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 25%, rgba(255, 246, 212, .35) 50%, transparent 75%);
    transform: translateX(-120%); animation: sheen 4.2s infinite ease-in-out;
  }
  @keyframes sheen { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(130%); } }
  #ctaBtn:hover {
    background: linear-gradient(135deg, rgba(250, 210, 110, .38), rgba(195, 138, 36, .42));
    border-color: rgba(255, 236, 175, .92);
    box-shadow: 0 10px 34px rgba(0, 0, 0, .55), 0 0 36px rgba(255, 212, 108, .5), inset 0 1px 0 rgba(255, 252, 235, .55);
    transform: translateY(-2px);
  }
  #ctaBtn svg { width: 15px; height: 15px; stroke: #ffe194; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #giftModal {
    position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center;
    background: rgba(2, 5, 14, .74); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #giftModal.show { opacity: 1; pointer-events: auto; }
  #giftCard {
    position: relative; width: min(440px, 88vw); padding: 38px 32px 30px; text-align: center;
    border-radius: 22px; color: #f6eedc;
    background: #080e1e;
    background-image: radial-gradient(ellipse at top, #182545 0%, #091022 68%, #060a16 100%);
    border: 1px solid rgba(248, 212, 128, .5);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .85), 0 0 65px rgba(245, 198, 92, .22), inset 0 1px 0 rgba(255, 245, 215, .32);
    transform: scale(.92) translateY(12px); transition: transform .5s cubic-bezier(.22,1,.36,1);
  }
  #giftModal.show #giftCard { transform: scale(1) translateY(0); }
  #giftCard .badge {
    display: inline-block; font-family: "Cinzel", Georgia, serif; font-size: 11px; letter-spacing: .24em;
    text-transform: uppercase; color: #f0c96e; margin-bottom: 10px;
  }
  #giftCard h2 {
    margin: 0 0 14px; font-family: "Playfair Display", "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-size: 32px; font-weight: 700;
    background: linear-gradient(135deg, #fff6da, #f3c45c, #ffe8aa); -webkit-background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(255, 206, 102, .35);
  }
  #giftCard p {
    margin: 0 0 24px; font-family: "Cormorant Garamond", Georgia, serif; font-size: 20px; line-height: 1.55;
    color: rgba(246, 240, 226, .92);
  }
  #giftCard .line {
    width: 110px; height: 1px; margin: 0 auto 20px;
    background: linear-gradient(90deg, transparent, rgba(245, 205, 115, .8), transparent);
  }
  #giftClose {
    padding: 11px 28px; border-radius: 999px; cursor: pointer;
    font-family: "Cinzel", Georgia, serif; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #1c1300; background: linear-gradient(135deg, #ffe28c, #e5a524); border: 0;
    box-shadow: 0 6px 22px rgba(240, 185, 60, .35); transition: transform .2s, filter .2s;
  }
  #giftClose:hover { transform: translateY(-1px); filter: brightness(1.08); }
  #hint {
    position: fixed; bottom: calc(min(3.2vh, 28px) + 12px); left: 50%; transform: translateX(-50%); z-index: 6;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; letter-spacing: .04em;
    color: rgba(240,232,212,.78); background: rgba(6,12,24,.45); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(8px); pointer-events: none; opacity: 0; transition: opacity 1s ease;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #hint.show { opacity: 1; }
  #box .icon { font-size: 44px; margin-bottom: 8px; }
  #box h1 { font-size: 20px; font-weight: 600; margin: 0 0 22px; line-height: 1.35; }
  #pw {
    width: 100%; box-sizing: border-box; padding: 13px 14px; font-size: 16px; color: #fff;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; outline: none;
  }
  #pw:focus { border-color: #f2c14e; box-shadow: 0 0 0 3px rgba(242,193,78,.2); }
  #box button {
    margin-top: 14px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    color: #1a1200; background: linear-gradient(#ffd56b, #e8a923); border: 0; border-radius: 10px;
  }
  #box button:hover { filter: brightness(1.08); }
  #msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: #ff8a7a; }
  #vidWrap { display: none; margin-top: 14px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); background: #000; }
  #vidWrap.show { display: block; animation: fadeIn .35s ease; }
  #eslemVid { display: block; width: 100%; max-height: 52vh; background: #000; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .shake { animation: shake .45s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar top"></div>
<div class="bar bot"></div>
<div id="hud">
  <button id="btnMusic" type="button" title="Müzik kutusu">
    <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
    <span>Müzik</span>
  </button>
  <button id="btnFw" type="button" title="Havai fişek gösterisi">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
    <span>Fişek</span>
  </button>
  <button id="btnReplay" type="button" title="Animasyonu baştan oynat">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    <span>Tekrar</span>
  </button>
</div>
<div id="titleOverlay">
  <div class="tRule top"></div>
  <div class="tName" id="tName">Eslem’in</div>
  <div class="tSub" id="tSub">ağacına ulaşmaya<br>hak kazandınız</div>
  <div class="tRule bot"></div>
  <button id="ctaBtn" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
    <span>Hediyeni Aç</span>
  </button>
</div>
<div id="giftModal">
  <div id="giftCard">
    <div class="badge">✦ Yılbaşı Sürprizi ✦</div>
    <h2>Eslem’e Özel</h2>
    <div class="line"></div>
    <p>Bütün ışıklar senin için yandı…<br>Yeni yılda şansın, huzurun ve en güzel anıların hep seninle olsun ✨</p>
    <button id="giftClose" type="button">Şöleni Başlat</button>
  </div>
</div>
<div id="hint">Gökyüzüne tıkla: havai fişek ✨</div>
<div id="gate">
  <form id="form" autocomplete="off">
    <div id="box">
      <div class="icon">🎄</div>
      <h1>Okeyde tanıdığınız en iyi oyuncu kim?</h1>
      <input id="pw" type="text" placeholder="Cevabını yaz..." spellcheck="false">
      <button type="submit">Gir</button>
      <div id="msg"></div>
      <div id="vidWrap">
        <video id="eslemVid" src="m.mp4" controls playsinline></video>
      </div>
    </div>
  </form>
</div>
<script>
/*
 * Yöntem: Sahne önce gerçek bir illüstrasyon olarak (gradyanlar, iğne yapraklar,
 * parlak süs topları, 3B hediye kutuları) görünmez tuvallere çizilir; sonra her
 * katman renkli ASCII karakterlere dönüştürülür ve katman katman canlandırılır.
 */
(() => {
  const VW = 1000, VH = 900;          // sanal sahne boyutu
  const CXV = 500;                    // ağaç merkezi
  const TOP = 125, BOT = 690;         // ağaç üst / alt
  const LOOP = 19;
  const SS = 3;                       // hücre başına örnekleme

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scene = document.createElement('canvas');
  const sctx = scene.getContext('2d');
  const bloomA = document.createElement('canvas');
  const bloomB = document.createElement('canvas');

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const hwAt = y => 8 + (y - TOP) / (BOT - TOP) * 335;

  let W, H, DPR, fs, cellW, cellH, cols, rows, offX, offY;
  let cells = [], snow = [];
  const T_OFFSET = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
  let start = performance.now() - T_OFFSET * 1000;
  let lastT = 0, lastNow = performance.now();

  // ---------------------------------------------------------------- çizimler
  function drawGround(c) {
    // 1) Dış kenarları arka planla yumuşakça eriyen organik kar birikintisi
    c.save();
    c.translate(CXV, 718);
    c.scale(1, 78 / 455);
    const g = c.createRadialGradient(0, -10, 30, 0, 0, 455);
    g.addColorStop(0, 'rgba(218, 228, 244, 0.96)');
    g.addColorStop(0.45, 'rgba(155, 174, 204, 0.88)');
    g.addColorStop(0.75, 'rgba(72, 92, 128, 0.55)');
    g.addColorStop(0.92, 'rgba(24, 38, 66, 0.18)');
    g.addColorStop(1, 'rgba(10, 18, 36, 0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 455, 0, Math.PI * 2); c.fill();
    c.restore();

    // Doğal yan kar tümsekleri (platform hissini kırar)
    [[-330, 725, 140, 34], [340, 722, 145, 36], [-180, 738, 160, 32], [200, 736, 155, 30]].forEach(([x, y, rx, ry]) => {
      c.save();
      c.translate(x, y); c.scale(1, ry / rx);
      const dg = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      dg.addColorStop(0, 'rgba(150, 170, 200, 0.45)');
      dg.addColorStop(0.65, 'rgba(55, 75, 110, 0.22)');
      dg.addColorStop(1, 'rgba(10, 18, 36, 0)');
      c.fillStyle = dg;
      c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill();
      c.restore();
    });

    // Kar dokusu
    for (let i = 0; i < 420; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), 0.7);
      const x = CXV + Math.cos(a) * r * 395, y = 716 + Math.sin(a) * r * 62;
      const edgeFade = clamp(1 - r, 0.1, 1);
      c.fillStyle = Math.random() < 0.55 ? `rgba(255,255,255,${0.48 * edgeFade})` : `rgba(85,108,145,${0.32 * edgeFade})`;
      c.beginPath(); c.ellipse(x, y, rnd(4, 14), rnd(2, 4), 0, 0, Math.PI * 2); c.fill();
    }

    // Ağaç altı temas gölgesi
    const sh = c.createRadialGradient(CXV, 692, 15, CXV, 692, 290);
    sh.addColorStop(0, 'rgba(12, 22, 42, 0.68)');
    sh.addColorStop(0.65, 'rgba(20, 34, 60, 0.28)');
    sh.addColorStop(1, 'rgba(20, 34, 60, 0)');
    c.fillStyle = sh;
    c.beginPath(); c.ellipse(CXV, 694, 300, 38, 0, 0, Math.PI * 2); c.fill();

    // Ağaç ışıklarının kara düşen renkli yansımaları (sıcak altın + zümrüt + yakut + safir)
    const glows = [
      [CXV, 708, 220, '255, 212, 115', 0.34],
      [CXV - 140, 712, 130, '95, 220, 130', 0.24],
      [CXV + 155, 714, 135, '255, 110, 100', 0.24],
      [CXV + 50, 722, 115, '105, 170, 255', 0.22],
      [CXV - 260, 710, 110, '185, 130, 255', 0.20]
    ];
    c.save();
    c.globalCompositeOperation = 'lighter';
    glows.forEach(([gx, gy, r, col, a]) => {
      c.save();
      c.translate(gx, gy); c.scale(1, 0.28);
      const rg = c.createRadialGradient(0, 0, 0, 0, 0, r);
      rg.addColorStop(0, `rgba(${col},${a})`);
      rg.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = rg;
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.restore();
    });
    c.restore();
  }

  function tierPath(i, N) {
    const yt = TOP + (BOT - TOP) * (i / N) * 0.93;
    const yb = TOP + (BOT - TOP) * ((i + 1) / N) + 10;
    const wt = i === 0 ? 0 : hwAt(yt) * 0.42;
    const wb = hwAt(yb) * 1.02;
    const p = new Path2D();
    p.moveTo(CXV - wt, yt);
    p.lineTo(CXV + wt, yt);
    p.quadraticCurveTo(CXV + wb * 0.55, yt + (yb - yt) * 0.45, CXV + wb, yb);
    const m = Math.max(4, Math.round(wb / 34));
    for (let s = 0; s < m; s++) {
      const x0 = CXV + wb - (2 * wb) * (s / m);
      const x1 = CXV + wb - (2 * wb) * ((s + 1) / m);
      const droop = x => yb + 16 * (1 - Math.pow((x - CXV) / wb, 2));
      const mx = (x0 + x1) / 2;
      p.quadraticCurveTo(mx, droop(mx) + 14, x1, droop(x1));
    }
    p.quadraticCurveTo(CXV - wb * 0.55, yt + (yb - yt) * 0.45, CXV - wt, yt);
    p.closePath();
    return { p, yt, yb, wb };
  }

  function drawTree(c) {
    // gövde
    const tg = c.createLinearGradient(CXV - 30, 0, CXV + 30, 0);
    tg.addColorStop(0, '#5a3418'); tg.addColorStop(1, '#2a160a');
    c.fillStyle = tg; c.fillRect(CXV - 28, BOT - 30, 56, 55);

    const N = 8;
    for (let i = N - 1; i >= 0; i--) {
      const { p, yt, yb, wb } = tierPath(i, N);
      c.save();
      c.shadowColor = 'rgba(0,0,0,.85)'; c.shadowBlur = 6; c.shadowOffsetY = 4;
      const vg = c.createLinearGradient(0, yt, 0, yb + 20);
      vg.addColorStop(0, '#06260c'); vg.addColorStop(0.6, '#135a20'); vg.addColorStop(1, '#2a8a36');
      c.fillStyle = vg; c.fill(p);
      c.restore();

      c.save(); c.clip(p);
      // iğne yapraklar
      const count = Math.round(wb * (yb - yt) / 22);
      for (let k = 0; k < count; k++) {
        const fy = Math.random();
        const y = yt + fy * (yb - yt + 22);
        const w = hwAt(y) * 1.02;
        const x = CXV + rnd(-w, w);
        const dir = (x - CXV) / Math.max(w, 1);
        const ang = Math.PI / 2 - dir * 1.15 + rnd(-0.35, 0.35);
        const len = rnd(9, 22);
        const L = 14 + fy * 38 - dir * 9 + rnd(-8, 8);
        c.strokeStyle = `hsl(${rnd(112, 140)},${rnd(45, 70)}%,${clamp(L, 6, 62)}%)`;
        c.lineWidth = rnd(1.8, 3.2);
        c.beginPath(); c.moveTo(x, y);
        c.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); c.stroke();
      }
      // dal uçlarında kar
      for (let x = -wb; x <= wb; x += rnd(6, 14)) {
        if (Math.random() < 0.45) continue;
        const yy = yb + 16 * (1 - (x / wb) ** 2) - rnd(2, 10);
        c.fillStyle = `rgba(${230 + rnd(0, 25) | 0},${238 + rnd(0, 17) | 0},255,${rnd(0.55, 0.9)})`;
        c.beginPath(); c.ellipse(CXV + x, yy, rnd(4, 10), rnd(2, 4), rnd(-0.3, 0.3), 0, 7); c.fill();
      }
      // ışık: sol üst aydınlık, sağ gölge
      const lg = c.createLinearGradient(CXV - wb, 0, CXV + wb, 0);
      lg.addColorStop(0, 'rgba(210,255,170,.14)'); lg.addColorStop(0.45, 'rgba(0,0,0,0)');
      lg.addColorStop(1, 'rgba(0,0,0,.45)');
      c.fillStyle = lg; c.fill(p);
      c.restore();
    }
  }

  function garlandY(j, x) {
    const yc = TOP + (BOT - TOP) * (0.2 + j * 0.155);
    const hw = hwAt(yc) * 0.95;
    return { y: yc - 0.26 * x + 24 * (1 - (x / hw) ** 2), hw };
  }

  function drawGarland(c) {
    for (let j = 0; j < 5; j++) {
      const hw = garlandY(j, 0).hw;
      const pts = [];
      for (let x = -hw; x <= hw; x += 4) pts.push([CXV + x, garlandY(j, x).y]);
      c.lineCap = 'round';
      c.strokeStyle = '#7e1010'; c.lineWidth = 12;
      c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke();
      // sim (tinsel)
      for (let k = 0; k < pts.length * 6; k++) {
        const q = pick(pts);
        const a = Math.random() * Math.PI * 2, l = rnd(4, 9);
        const x = q[0] + rnd(-4, 4), y = q[1] + rnd(-5, 5);
        c.strokeStyle = Math.random() < 0.12 ? pick(['#ffd36a', '#f5b638']) : pick(['#e63b2e', '#ff6347', '#c21d1d', '#ff8a6a']);
        c.lineWidth = rnd(1.5, 3);
        c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
      }
      // altın boncuk dizisi
      for (let x = -hw * 0.9; x <= hw * 0.9 && false; x += 15) {
        const y = garlandY(j, x).y + 22 + 10 * (1 - (x / hw) ** 2);
        const bg = c.createRadialGradient(CXV + x - 1.5, y - 1.5, 0.5, CXV + x, y, 5);
        bg.addColorStop(0, '#fff2b8'); bg.addColorStop(1, '#b07a12');
        c.fillStyle = bg; c.beginPath(); c.arc(CXV + x, y, 4.5, 0, Math.PI * 2); c.fill();
      }
    }
  }

  function makeOrnaments() {
    const palette = [
      { col: '#c8102e', rib: '#f2c14e' }, { col: '#d4af37', rib: '#fff1c1' },
      { col: '#1f4fbf', rib: '#e8eef8' }, { col: '#8b1e3f', rib: '#f2c14e' },
      { col: '#e8eef6', rib: '#c8102e' }, { col: '#b8860b', rib: '#c8102e' },
      { col: '#2e7d5b', rib: '#f2c14e' }, { col: '#d9467a', rib: '#fff1c1' }
    ];
    const types = ['ball', 'ball', 'ball', 'band', 'band', 'bell', 'cane', 'gift', 'bow', 'starO', 'drop'];
    const list = [];
    let tries = 0;
    while (list.length < 40 && tries++ < 6000) {
      const y = rnd(TOP + 70, BOT - 15);
      const hw = hwAt(y) * 0.9;
      const x = CXV + rnd(-hw, hw);
      const depth = (y - TOP) / (BOT - TOP);
      const r = rnd(18, 27) * (0.7 + 0.45 * depth);
      if (list.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 9)) continue;
      const p = pick(palette);
      list.push({ x, y, r, col: p.col, rib: p.rib, type: pick(types), rot: rnd(-0.35, 0.35) });
    }
    list.sort(() => Math.random() - 0.5);
    return list;
  }

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function sphere(c, x, y, r, col) {
    const g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.05, x, y, r);
    g.addColorStop(0, shade(col, 0.85));
    g.addColorStop(0.22, shade(col, 0.25));
    g.addColorStop(0.65, col);
    g.addColorStop(1, shade(col, -0.7));
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    // alt yansıma
    const rg = c.createRadialGradient(x + r * 0.3, y + r * 0.55, 0, x + r * 0.3, y + r * 0.55, r * 0.5);
    rg.addColorStop(0, 'rgba(255,255,255,.28)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = rg; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    // parlak nokta
    c.fillStyle = 'rgba(255,255,255,.95)';
    c.beginPath(); c.ellipse(x - r * 0.38, y - r * 0.42, r * 0.2, r * 0.12, -0.6, 0, Math.PI * 2); c.fill();
  }

  function cap(c, x, y, w) {
    const g = c.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, '#fff0b5'); g.addColorStop(0.5, '#c99a2e'); g.addColorStop(1, '#6b4a0e');
    c.fillStyle = g; c.fillRect(x - w, y - 7, w * 2, 8);
    c.strokeStyle = '#d9c9a0'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(x, y - 10, 3.5, 0, Math.PI * 2); c.stroke();
  }

  function drawOrnament(c, o) {
    const { x, y, r, col, rib } = o;
    c.save();
    c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = 6; c.shadowOffsetY = 4;
    switch (o.type) {
      case 'ball':
        sphere(c, x, y, r, col); c.shadowColor = 'transparent'; cap(c, x, y - r + 2, r * 0.3);
        break;
      case 'band': {
        sphere(c, x, y, r, col);
        c.shadowColor = 'transparent';
        c.save(); c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.clip();
        const bg = c.createLinearGradient(0, y - r * 0.2, 0, y + r * 0.2);
        bg.addColorStop(0, shade(rib, 0.5)); bg.addColorStop(0.5, rib); bg.addColorStop(1, shade(rib, -0.5));
        c.fillStyle = bg;
        c.beginPath(); c.ellipse(x, y, r * 1.1, r * 0.2, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = shade(rib, 0.3);
        for (let a = -0.8; a <= 0.8; a += 0.4) {
          c.beginPath(); c.arc(x + a * r, y - r * 0.45 + Math.abs(a) * r * 0.15, r * 0.07, 0, 7); c.fill();
          c.beginPath(); c.arc(x + a * r, y + r * 0.45 - Math.abs(a) * r * 0.15, r * 0.07, 0, 7); c.fill();
        }
        c.restore();
        // parlaklığı yeniden ver
        c.fillStyle = 'rgba(255,255,255,.9)';
        c.beginPath(); c.ellipse(x - r * 0.38, y - r * 0.5, r * 0.18, r * 0.1, -0.6, 0, 7); c.fill();
        cap(c, x, y - r + 2, r * 0.3);
        break;
      }
      case 'drop': {
        // damla / gözyaşı biçimli cam süs
        const g = c.createLinearGradient(x - r, 0, x + r, 0);
        g.addColorStop(0, shade(col, 0.6)); g.addColorStop(0.35, col); g.addColorStop(1, shade(col, -0.7));
        c.fillStyle = g;
        c.beginPath();
        c.moveTo(x, y - r * 1.3);
        c.bezierCurveTo(x + r * 0.9, y - r * 0.2, x + r * 0.9, y + r * 0.9, x, y + r * 0.95);
        c.bezierCurveTo(x - r * 0.9, y + r * 0.9, x - r * 0.9, y - r * 0.2, x, y - r * 1.3);
        c.fill();
        c.shadowColor = 'transparent';
        c.fillStyle = 'rgba(255,255,255,.85)';
        c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.1, r * 0.1, r * 0.4, 0.15, 0, 7); c.fill();
        cap(c, x, y - r * 1.25, r * 0.22);
        break;
      }
      case 'bell': {
        c.translate(x, y); c.rotate(o.rot);
        const g = c.createLinearGradient(-r, 0, r, 0);
        g.addColorStop(0, '#fff2b0'); g.addColorStop(0.35, '#e0b23a'); g.addColorStop(1, '#6e4a08');
        c.fillStyle = g;
        c.beginPath();
        c.moveTo(-r * 0.25, -r);
        c.quadraticCurveTo(-r * 0.75, -r * 0.8, -r * 0.7, r * 0.2);
        c.quadraticCurveTo(-r * 0.75, r * 0.7, -r * 1.05, r * 0.85);
        c.lineTo(r * 1.05, r * 0.85);
        c.quadraticCurveTo(r * 0.75, r * 0.7, r * 0.7, r * 0.2);
        c.quadraticCurveTo(r * 0.75, -r * 0.8, r * 0.25, -r);
        c.closePath(); c.fill();
        c.shadowColor = 'transparent';
        c.fillStyle = '#8a5d0a';
        c.beginPath(); c.ellipse(0, r * 0.85, r * 1.05, r * 0.16, 0, 0, 7); c.fill();
        c.fillStyle = '#ffe9a0';
        c.beginPath(); c.arc(0, r * 1.02, r * 0.2, 0, 7); c.fill();
        // kırmızı fiyonk
        c.fillStyle = '#c8102e';
        c.beginPath(); c.ellipse(-r * 0.35, -r * 1.05, r * 0.4, r * 0.2, -0.4, 0, 7); c.fill();
        c.beginPath(); c.ellipse(r * 0.35, -r * 1.05, r * 0.4, r * 0.2, 0.4, 0, 7); c.fill();
        c.fillStyle = '#ff4a5e'; c.beginPath(); c.arc(0, -r * 1.02, r * 0.14, 0, 7); c.fill();
        break;
      }
      case 'cane': {
        c.translate(x, y); c.rotate(o.rot);
        const path = new Path2D();
        path.moveTo(r * 0.25, r * 1.2);
        path.lineTo(r * 0.25, -r * 0.4);
        path.arc(-r * 0.15, -r * 0.4, r * 0.4, 0, Math.PI, true);
        c.lineCap = 'round';
        c.strokeStyle = '#f4f4f4'; c.lineWidth = r * 0.36; c.stroke(path);
        c.shadowColor = 'transparent';
        c.setLineDash([r * 0.22, r * 0.22]);
        c.strokeStyle = '#d0142c'; c.lineWidth = r * 0.36; c.stroke(path);
        c.setLineDash([]);
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = r * 0.08;
        c.translate(-r * 0.08, 0); c.stroke(path);
        break;
      }
      case 'gift': {
        const s = r * 0.85;
        const g = c.createLinearGradient(x - s, y - s, x + s, y + s);
        g.addColorStop(0, shade(col, 0.3)); g.addColorStop(1, shade(col, -0.45));
        c.fillStyle = g; c.fillRect(x - s, y - s * 0.8, s * 2, s * 1.8);
        c.shadowColor = 'transparent';
        c.fillStyle = rib;
        c.fillRect(x - s * 0.15, y - s * 0.8, s * 0.3, s * 1.8);
        c.fillRect(x - s, y + s * 0.0, s * 2, s * 0.26);
        c.beginPath(); c.ellipse(x - s * 0.35, y - s * 0.95, s * 0.38, s * 0.22, -0.4, 0, 7); c.fill();
        c.beginPath(); c.ellipse(x + s * 0.35, y - s * 0.95, s * 0.38, s * 0.22, 0.4, 0, 7); c.fill();
        break;
      }
      case 'bow': {
        c.translate(x, y);
        const red = c.createLinearGradient(-r, -r, r, r);
        red.addColorStop(0, '#ff4d5e'); red.addColorStop(0.5, '#c8102e'); red.addColorStop(1, '#5e0612');
        c.fillStyle = red;
        c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-r * 1.3, -r * 0.9, -r * 1.3, r * 0.6, 0, 0); c.fill();
        c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(r * 1.3, -r * 0.9, r * 1.3, r * 0.6, 0, 0); c.fill();
        c.beginPath(); c.moveTo(-r * 0.1, 0); c.lineTo(-r * 0.6, r * 1.2); c.lineTo(-r * 0.25, r * 1.05); c.lineTo(0, r * 0.2); c.fill();
        c.beginPath(); c.moveTo(r * 0.1, 0); c.lineTo(r * 0.6, r * 1.2); c.lineTo(r * 0.25, r * 1.05); c.lineTo(0, r * 0.2); c.fill();
        c.shadowColor = 'transparent';
        c.fillStyle = '#9c0a20'; c.beginPath(); c.arc(0, 0, r * 0.22, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.4)';
        c.beginPath(); c.ellipse(-r * 0.7, -r * 0.2, r * 0.25, r * 0.08, -0.5, 0, 7); c.fill();
        break;
      }
      case 'starO': {
        c.translate(x, y); c.rotate(o.rot);
        const R = r * 1.05, ri = R * 0.45;
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? ri : R;
          c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        c.closePath();
        const g = c.createLinearGradient(-R, -R, R, R);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#cfd8e6'); g.addColorStop(1, '#5d6b80');
        c.fillStyle = g; c.fill();
        c.shadowColor = 'transparent';
        c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5; c.stroke();
        break;
      }
    }
    c.restore();
  }

  function drawOrnaments(c, list) {
    for (const o of list) drawOrnament(c, o);
  }

  const LIGHT_COLS = [
    ['#fffbe6', '#ffd56b'], ['#fffbe6', '#ffd56b'], ['#fff0f0', '#ff5a5a'],
    ['#eef6ff', '#5aa0ff'], ['#f0fff0', '#6aff8a'], ['#fff6ff', '#ff7ad9']
  ];

  function makeLights() {
    const list = [];
    for (let j = 0; j < 5; j++) {
      const hw = garlandY(j, 0).hw;
      for (let x = -hw * 0.9; x <= hw * 0.9; x += rnd(30, 46))
        list.push({ x: CXV + x, y: garlandY(j, x).y - rnd(10, 20) });
    }
    for (let i = 0; i < 30; i++) {
      const y = rnd(TOP + 50, BOT - 20), hw = hwAt(y) * 0.88;
      list.push({ x: CXV + rnd(-hw, hw), y });
    }
    list.forEach(l => {
      l.ph = Math.random() * 6.28; l.sp = rnd(1.5, 4.5);
      l.t0 = 6.4 + Math.random() * 1.2; l.c = pick(LIGHT_COLS);
    });
    return list;
  }

  function drawLights(c, list) {
    for (const l of list) {
      const g = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, 10);
      g.addColorStop(0, l.c[0]); g.addColorStop(0.4, l.c[1]); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(l.x, l.y, 10, 0, Math.PI * 2); c.fill();
    }
  }

  function drawStar(c) {
    const cy = 92, R = 52, r = 21;
    const p = new Path2D();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
      const x = CXV + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath();
    const g = c.createLinearGradient(CXV - R, cy - R, CXV + R, cy + R);
    g.addColorStop(0, '#fff6c2'); g.addColorStop(0.4, '#ffc93c'); g.addColorStop(1, '#a8650c');
    c.fillStyle = g; c.fill(p);
    c.strokeStyle = '#7a4a06'; c.lineWidth = 3; c.stroke(p);
    // orta parlama
    const h = c.createRadialGradient(CXV - 6, cy - 6, 0, CXV, cy, 22);
    h.addColorStop(0, 'rgba(255,255,230,.9)'); h.addColorStop(1, 'rgba(255,255,230,0)');
    c.fillStyle = h; c.fill(p);
  }

  const GIFTS = [
    { x: 108, y: 552, w: 72,  h: 122, d: 24, col: '#693ab5', rib: '#f5cb5c', rot: -0.065, glow: '255,215,120', snow: true },
    { x: 204, y: 632, w: 138, h: 106, d: 30, col: '#26853a', rib: '#f2c14e', rot: 0.032,  glow: '255,220,125', snow: true },
    { x: 382, y: 676, w: 88,  h: 78,  d: 22, col: '#c92a2a', rib: '#ffe38f', rot: -0.045, glow: '255,215,130', snow: false },
    { x: 472, y: 696, w: 66,  h: 56,  d: 18, col: '#d49a2a', rib: '#c81d25', rot: 0.06,   glow: '255,240,175', snow: false },
    { x: 566, y: 644, w: 108, h: 112, d: 28, col: '#2458c8', rib: '#f5cb5c', rot: -0.035, glow: '185,220,255', snow: true },
    { x: 742, y: 586, w: 148, h: 118, d: 34, col: '#b8252a', rib: '#f5cb5c', rot: 0.055,  glow: '255,205,115', snow: true }
  ];
  const GIFT_ORDER = [1, 0, 4, 2, 3, 5];

  function drawGift(c, b) {
    const { x, y, w, h, d, col, rib, rot = 0, glow = '255,220,130', snow: hasSnow = false } = b;
    const dx = d * 0.75, dy = d * 0.55;
    c.save();
    // kutuyu merkezinden hafifçe eğerek doğal duruş ver
    const cx = x + w / 2, cy = y + h / 2;
    c.translate(cx, cy);
    c.rotate(rot);
    c.translate(-cx, -cy);

    // yere temas gölgesi
    c.fillStyle = 'rgba(0,0,0,0.48)';
    c.beginPath(); c.ellipse(x + w * 0.56, y + h + 4, w * 0.62, 10, 0, 0, Math.PI * 2); c.fill();

    c.save();
    c.shadowColor = 'rgba(0,0,0,.65)'; c.shadowBlur = 8; c.shadowOffsetY = 5;
    // ön yüz
    const fg = c.createLinearGradient(x, y, x + w, y + h);
    fg.addColorStop(0, shade(col, 0.22)); fg.addColorStop(0.55, col); fg.addColorStop(1, shade(col, -0.42));
    c.fillStyle = fg; c.fillRect(x, y, w, h);
    c.restore();

    // sim / zarif desen detayları (ön yüzde)
    c.fillStyle = 'rgba(255,245,215,0.22)';
    for (let s = 0; s < 14; s++) {
      const sx = x + ((s * 37 + 11) % Math.max(12, Math.floor(w - 10))) + 5;
      const sy = y + ((s * 53 + 9) % Math.max(12, Math.floor(h - 10))) + 5;
      c.beginPath(); c.arc(sx, sy, (s % 3) ? 1.8 : 2.6, 0, Math.PI * 2); c.fill();
    }

    // üst yüz + ağaç ışıklarının üst yüzeye düşen sıcak yansıması
    const tg = c.createLinearGradient(x, y - dy, x + w + dx, y);
    tg.addColorStop(0, shade(col, 0.42)); tg.addColorStop(1, shade(col, 0.12));
    c.fillStyle = tg;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx, y - dy); c.lineTo(x + w + dx, y - dy); c.lineTo(x + w, y); c.closePath(); c.fill();

    // üst yüzeyde sıcak ağaç ışığı parlaması (bounce glow)
    c.save();
    c.globalCompositeOperation = 'lighter';
    const topGlow = c.createRadialGradient(x + w * 0.52 + dx * 0.4, y - dy * 0.45, 2, x + w * 0.52 + dx * 0.4, y - dy * 0.45, w * 0.72);
    topGlow.addColorStop(0, `rgba(${glow}, 0.52)`);
    topGlow.addColorStop(0.6, `rgba(${glow}, 0.18)`);
    topGlow.addColorStop(1, `rgba(${glow}, 0)`);
    c.fillStyle = topGlow;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx, y - dy); c.lineTo(x + w + dx, y - dy); c.lineTo(x + w, y); c.closePath(); c.fill();
    c.restore();

    // yan yüz
    const sg = c.createLinearGradient(x + w, y, x + w + dx, y + h);
    sg.addColorStop(0, shade(col, -0.35)); sg.addColorStop(1, shade(col, -0.68));
    c.fillStyle = sg;
    c.beginPath(); c.moveTo(x + w, y); c.lineTo(x + w + dx, y - dy); c.lineTo(x + w + dx, y + h - dy); c.lineTo(x + w, y + h); c.closePath(); c.fill();

    // kurdeleler
    const rw = Math.max(9, w * 0.13);
    const rg = c.createLinearGradient(x + w / 2 - rw / 2, 0, x + w / 2 + rw / 2, 0);
    rg.addColorStop(0, shade(rib, 0.45)); rg.addColorStop(0.5, rib); rg.addColorStop(1, shade(rib, -0.32));
    c.fillStyle = rg; c.fillRect(x + w / 2 - rw / 2, y, rw, h);
    c.fillStyle = shade(rib, -0.08); c.fillRect(x, y + h * 0.42, w, rw * 0.9);
    c.fillStyle = shade(rib, -0.45);
    c.beginPath(); c.moveTo(x + w, y + h * 0.42); c.lineTo(x + w + dx, y + h * 0.42 - dy);
    c.lineTo(x + w + dx, y + h * 0.42 - dy + rw * 0.9); c.lineTo(x + w, y + h * 0.42 + rw * 0.9); c.fill();
    c.fillStyle = shade(rib, 0.3);
    c.beginPath(); c.moveTo(x + w / 2 - rw / 2, y); c.lineTo(x + w / 2 - rw / 2 + dx, y - dy);
    c.lineTo(x + w / 2 + rw / 2 + dx, y - dy); c.lineTo(x + w / 2 + rw / 2, y); c.fill();

    // üst kenarda ince kar birikintisi
    if (hasSnow) {
      c.fillStyle = 'rgba(235, 244, 255, 0.78)';
      for (let i = 0; i < 6; i++) {
        const sx = x + w * (0.1 + i * 0.16);
        c.beginPath(); c.ellipse(sx, y + 1, rnd(6, 12), rnd(2.2, 3.8), 0, 0, Math.PI * 2); c.fill();
      }
    }

    // fiyonk
    const bx = x + w / 2 + dx / 2, by = y - dy / 2 - 4;
    const bs = clamp(w / 105, 0.72, 1.15);
    c.fillStyle = shade(rib, 0.15);
    c.beginPath(); c.ellipse(bx - 14 * bs, by - 6 * bs, 15 * bs, 9 * bs, -0.45, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(bx + 14 * bs, by - 6 * bs, 15 * bs, 9 * bs, 0.45, 0, Math.PI * 2); c.fill();
    c.fillStyle = shade(rib, -0.32);
    c.beginPath(); c.ellipse(bx - 13 * bs, by - 6 * bs, 7 * bs, 4 * bs, -0.45, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(bx + 13 * bs, by - 6 * bs, 7 * bs, 4 * bs, 0.45, 0, Math.PI * 2); c.fill();
    c.fillStyle = shade(rib, 0.55);
    c.beginPath(); c.arc(bx, by - 3 * bs, 6 * bs, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // ------------------------------------------------- katman -> ASCII hücreleri
  function sampleLayer(drawFn) {
    const lc = document.createElement('canvas');
    lc.width = cols * SS; lc.height = rows * SS;
    const c = lc.getContext('2d');
    c.setTransform(lc.width / VW, 0, 0, lc.height / VH, 0, 0);
    drawFn(c);
    return c.getImageData(0, 0, lc.width, lc.height).data;
  }

  const RAMP = {
    tree:   ' .,:;+=*#%&@8',
    ground: ' .-:=-=+=#=%',
    solid:  ' .:-=+*#%@@',
    light:  ' .:+*#@@'
  };

  function buildScene() {
    const ornaments = makeOrnaments();
    const lights = makeLights();
    const layers = [
      { name: 'ground', ramp: RAMP.ground, draw: drawGround,
        t0: (vx, vy) => 2.0 + Math.hypot((vx - CXV) / 425, (vy - 712) / 72) * 1.1 + rnd(0, 0.3) },
      { name: 'tree', ramp: RAMP.tree, draw: drawTree, flick: true,
        t0: (vx, vy) => 2.6 + (BOT - vy) / (BOT - TOP) * 1.7 + rnd(0, 0.5) },
      { name: 'garland', ramp: RAMP.solid, draw: drawGarland,
        t0: (vx, vy) => 5.3 + (vy - TOP) / (BOT - TOP) * 1.3 + (vx / VW) * 0.35 },
      { name: 'orn', ramp: RAMP.solid, draw: c => drawOrnaments(c, ornaments),
        t0: (vx, vy) => {
          let best = 0, bd = 1e9;
          ornaments.forEach((o, i) => { const d = Math.hypot(o.x - vx, o.y - vy) - o.r; if (d < bd) { bd = d; best = i; } });
          return 8.6 + best * 0.09;
        }, tw: 0.06 },
      { name: 'lights', ramp: RAMP.light, draw: c => drawLights(c, lights), lights: true },
      { name: 'star', ramp: RAMP.solid, draw: drawStar,
        t0: () => 4.6 + rnd(0, 0.35), tw: 0.12 },
      { name: 'gifts', ramp: RAMP.solid, draw: c => GIFTS.forEach(b => drawGift(c, b)),
        t0: (vx, vy) => {
          let gi = 0, bd = 1e9;
          GIFTS.forEach((b, i) => { const d = Math.abs(vx - (b.x + b.w / 2 + b.d / 3)) / b.w; if (d < bd) { bd = d; gi = i; } });
          const b = GIFTS[gi];
          return 7.1 + GIFT_ORDER[gi] * 0.3 + clamp((vy - b.y + 40) / (b.h + 40), 0, 1) * 0.25;
        } }
    ];

    cells = [];
    const map = new Map();
    const n = SS * SS;
    for (const L of layers) {
      const data = sampleLayer(L.draw);
      const lw = cols * SS;
      for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
        let sr = 0, sg = 0, sb = 0, sa = 0;
        for (let j = 0; j < SS; j++) for (let i = 0; i < SS; i++) {
          const p = ((cy * SS + j) * lw + cx * SS + i) * 4;
          const a = data[p + 3];
          sr += data[p] * a; sg += data[p + 1] * a; sb += data[p + 2] * a; sa += a;
        }
        const alpha = sa / (n * 255);
        const minA = L.name === 'ground' ? 0.14 : 0.42;
        if (alpha < minA) continue;
        const gAlpha = L.name === 'ground' ? clamp((alpha - 0.14) / 0.72, 0, 1) : 1;
        const r = sr / sa, g = sg / sa, b = sb / sa;
        const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255 * gAlpha;
        const mx = Math.max(r, g, b) / 255 * gAlpha;
        const ramp = L.ramp;
        const ch = ramp[clamp(Math.round((lum * 0.55 + mx * 0.45) * (ramp.length - 1) * 1.15), 1, ramp.length - 1)];
        const vx = (cx + 0.5) / cols * VW, vy = (cy + 0.5) / rows * VH;
        const e = { ch, r, g, b, lay: L.name, ga: gAlpha };
        if (L.lights) {
          let best = lights[0], bd = 1e9;
          for (const l of lights) { const d = Math.hypot(l.x - vx, l.y - vy); if (d < bd) { bd = d; best = l; } }
          e.t0 = best.t0; e.tw = 0.55; e.ph = best.ph; e.sp = best.sp;
        } else {
          e.t0 = L.t0(vx, vy);
          if (L.tw) { e.tw = L.tw; e.ph = Math.random() * 6.28; e.sp = 2.5; }
        }
        e.flick = !!L.flick;
        const k = e.lay === 'ground' ? 1.05 : 1.22;
        if (e.lay === 'ground') {
          e.fg = `rgba(${clamp(r * k, 0, 255) | 0},${clamp(g * k, 0, 255) | 0},${clamp(b * k, 0, 255) | 0},${(gAlpha * 0.92).toFixed(2)})`;
          e.bg = gAlpha > 0.45 ? `rgba(${r * 0.24 | 0},${g * 0.24 | 0},${b * 0.28 | 0},${((gAlpha - 0.45) * 0.55).toFixed(2)})` : null;
        } else {
          e.fg = `rgb(${clamp(r * k, 0, 255) | 0},${clamp(g * k, 0, 255) | 0},${clamp(b * k, 0, 255) | 0})`;
          e.bg = `rgb(${r * 0.26 | 0},${g * 0.26 | 0},${b * 0.26 | 0})`;
        }
        const key = cy * cols + cx;
        let cell = map.get(key);
        if (!cell) {
          cell = { px: offX + cx * cellW, py: offY + cy * cellH, stack: [], cur: -1, fl: false, ramp };
          map.set(key, cell); cells.push(cell);
        }
        cell.stack.push(e);
      }
    }
    sctx.clearRect(0, 0, W, H);
  }

  // ---- Performans: önceden çizilmiş parlama sprite önbelleği ----
  const glowCache = new Map();
  function getGlow(col) {
    let sp = glowCache.get(col);
    if (sp) return sp;
    sp = document.createElement('canvas');
    sp.width = 64; sp.height = 64;
    const gc = sp.getContext('2d');
    const g = gc.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(${col}, 1)`);
    g.addColorStop(0.35, `rgba(${col}, 0.5)`);
    g.addColorStop(0.7, `rgba(${col}, 0.14)`);
    g.addColorStop(1, `rgba(${col}, 0)`);
    gc.fillStyle = g;
    gc.fillRect(0, 0, 64, 64);
    glowCache.set(col, sp);
    return sp;
  }

  let animCells = [], treeAllBuilt = false, lastTwinkleMs = 0, sceneDirty = true;

  // --------------------------------------------------------------- yerleşim
  let isMobile = false, titleAnchorY = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    isMobile = W < 700 || (H > W * 1.15);
    DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.4 : 1.75);
    for (const c of [canvas, scene]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bloomA.width = Math.max(64, Math.ceil(W / (isMobile ? 6 : 4)));
    bloomA.height = Math.max(64, Math.ceil(H / (isMobile ? 6 : 4)));
    bloomB.width = Math.max(32, Math.ceil(W / 14));
    bloomB.height = Math.max(32, Math.ceil(H / 14));

    const scaleA = Math.min(W * 0.94 / VW, H * 0.92 / VH);
    sideFree = (W - VW * scaleA) / 2 + 85 * scaleA;
    let scale, shift = 0;
    if (sideFree > Math.max(250, W * 0.17) && W >= 860) {
      layout = 'side'; scale = scaleA; shift = sideFree * 0.22; sideFree += shift;
    } else {
      layout = 'bottom';
      const topSafe = 74, uiSpace = 195;
      const availH = Math.max(220, H - topSafe - uiSpace - 24);
      // Hem soldaki hem sağdaki hediye kutularının telefonda tam sığması için 0.98 ölçek
      scale = Math.min((W * 0.98) / VW, availH / (VH * 0.84));
    }
    const rw = VW * scale, rh = VH * scale;
    fs = clamp(rh / (isMobile ? 96 : 122), isMobile ? 4.8 : 5.8, 10);
    sctx.font = `bold ${fs}px Menlo, Consolas, "Courier New", monospace`;
    cellW = sctx.measureText('M').width;
    cellH = fs * 1.08;
    cols = Math.floor(rw / cellW); rows = Math.floor(rh / cellH);
    offX = (W - cols * cellW) / 2 + shift;
    if (layout === 'side') {
      offY = (H - rows * cellH) / 2;
    } else {
      // Telefon/dikey ekranda ağaç + yazı + butonu ekranın tam dengeli ortasına yerleştir
      const topSafe = 70;
      const starTopFrac = 40 / VH, snowBotFrac = 795 / VH;
      const visualTreeH = rows * cellH * (snowBotFrac - starTopFrac);
      const uiBlockH = 185;
      const totalH = visualTreeH + uiBlockH;
      const startY = Math.max(topSafe, topSafe + (H - topSafe - 36 - totalH) * 0.48);
      offY = startY - rows * cellH * starTopFrac;
      titleAnchorY = offY + rows * cellH * snowBotFrac + 18;
    }
    groundY = offY + rows * cellH * (712 / VH);
    buildBackground();
    positionTitleOverlay();

    snow = [];
    const snowDiv = isMobile ? 4200 : 3000;
    const n = clamp(Math.round(W * H / snowDiv), 45, isMobile ? 95 : 220);
    for (let i = 0; i < n; i++) snow.push(flake(true));
    buildScene();
    treeAllBuilt = false; sceneDirty = true;
    animCells = cells.filter(c => c.stack.some(e => e.tw || e.flick));
  }

  function flake(anyY) {
    const z = Math.random();
    return {
      x: Math.random() * W, y: anyY ? Math.random() * H : -12,
      vy: 10 + z * 34, vx: rnd(-4, 6), amp: rnd(4, 16), ph: Math.random() * 6.28, fr: rnd(0.25, 0.9),
      a: 0.16 + z * 0.62, s: 0.7 + z * 2.1, soft: z > 0.82
    };
  }

  // ------------------------------------------------------------- arka plan
  const bgCanvas = document.createElement('canvas');
  let twinkles = [], bokeh = [], shooting = null, layout = 'bottom', sideFree = 0, groundY = 0;

  function buildBackground() {
    bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
    const b = bgCanvas.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);

    const treeCx = offX + cols * cellW / 2;

    // 1) Derin gece stüdyo/gökyüzü gradyanı
    const sky = b.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#010207');
    sky.addColorStop(0.38, '#040917');
    sky.addColorStop(0.72, '#091428');
    sky.addColorStop(0.86, '#081020');
    sky.addColorStop(1, '#02040a');
    b.fillStyle = sky;
    b.fillRect(0, 0, W, H);

    // 2) Ağaç arkasında yumuşak atmosferik derinlik ışığı
    const backGlow = b.createRadialGradient(treeCx, groundY - H * 0.25, 0, treeCx, groundY - H * 0.22, Math.max(W, H) * 0.52);
    backGlow.addColorStop(0, 'rgba(26, 62, 108, 0.26)');
    backGlow.addColorStop(0.45, 'rgba(14, 34, 68, 0.14)');
    backGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    b.fillStyle = backGlow;
    b.fillRect(0, 0, W, H);

    // 3) Uzak siluet dağ sırası + sağ/sol ufukta ince ay ışıklı kar sırtı ve uzak çam ormanı
    const drawMistRidge = (yBase, amp, f1, f2, seed, colTop, colBot, rimAlpha) => {
      const pts = [];
      b.beginPath();
      b.moveTo(0, H);
      for (let x = 0; x <= W + 12; x += 12) {
        const rightLift = Math.max(0, (x - W * 0.58) / (W * 0.42)) * H * 0.042;
        const y = yBase - rightLift
          - amp * 0.55 * Math.sin(x * f1 + seed)
          - amp * 0.28 * Math.sin(x * f2 + seed * 1.9)
          - amp * 0.17 * Math.cos(x * f2 * 2.1 - seed);
        pts.push([x, y]);
        b.lineTo(x, y);
      }
      b.lineTo(W, H);
      b.closePath();
      const rg = b.createLinearGradient(0, yBase - amp - H * 0.05, 0, H);
      rg.addColorStop(0, colTop);
      rg.addColorStop(0.35, colBot);
      rg.addColorStop(1, '#020409');
      b.fillStyle = rg;
      b.fill();
      if (rimAlpha) {
        b.beginPath();
        pts.forEach(([x, y], i) => i ? b.lineTo(x, y) : b.moveTo(x, y));
        const rim = b.createLinearGradient(0, 0, W, 0);
        rim.addColorStop(0, `rgba(170, 200, 240, ${rimAlpha * 0.5})`);
        rim.addColorStop(0.55, `rgba(170, 200, 240, ${rimAlpha * 0.2})`);
        rim.addColorStop(0.85, `rgba(195, 220, 255, ${rimAlpha})`);
        rim.addColorStop(1, `rgba(160, 195, 240, ${rimAlpha * 0.4})`);
        b.strokeStyle = rim;
        b.lineWidth = 1.4;
        b.stroke();
      }
      return pts;
    };
    const farPts = drawMistRidge(groundY - H * 0.085, H * 0.065, 0.0022, 0.0061, 0.8, 'rgba(24, 42, 74, 0.42)', 'rgba(8, 15, 30, 0.74)', 0.14);
    const nearPts = drawMistRidge(groundY - H * 0.032, H * 0.036, 0.0031, 0.0085, 2.7, 'rgba(18, 32, 58, 0.58)', 'rgba(6, 11, 22, 0.88)', 0.18);

    // Uzak atmosferik çam ormanı silüetleri (özellikle sağ ufuk dengesi + sol uzak kenar)
    const drawPineSilhouette = (x, baseY, h, col) => {
      b.fillStyle = col;
      const tiers = 4;
      for (let t = 0; t < tiers; t++) {
        const y0 = baseY - h * (1 - t * 0.21);
        const y1 = baseY - h * (0.68 - t * 0.22);
        const w = h * (0.14 + t * 0.085);
        b.beginPath();
        b.moveTo(x, y0);
        b.lineTo(x + w, y1);
        b.lineTo(x - w, y1);
        b.closePath();
        b.fill();
      }
    };
    // sağ ve sol kanat çam silüetleri (sis içinde silik)
    for (let i = 0; i < nearPts.length; i++) {
      const [px, py] = nearPts[i];
      const inRight = px > W * 0.70 && px < W * 0.99;
      const inLeft = px > W * 0.01 && px < W * 0.19;
      if (!inRight && !inLeft) continue;
      if (Math.random() > (inRight ? 0.68 : 0.42)) continue;
      const edgeProx = inRight ? (px - W * 0.70) / (W * 0.30) : (W * 0.19 - px) / (W * 0.19);
      const h = rnd(18, 42) * (0.65 + edgeProx * 0.7);
      const col = inRight ? 'rgba(9, 17, 34, 0.78)' : 'rgba(8, 15, 30, 0.62)';
      drawPineSilhouette(px + rnd(-5, 5), py + 4, h, col);
    }
    // daha uzaktaki çok silik arka sıra çamlar
    for (let i = 0; i < farPts.length; i++) {
      const [px, py] = farPts[i];
      if (px < W * 0.66 || Math.random() > 0.45) continue;
      drawPineSilhouette(px + rnd(-4, 4), py + 3, rnd(12, 24), 'rgba(14, 26, 48, 0.45)');
    }

    // 4) İnce ufuk sisi + karanlık yansıtıcı kış zemini
    const mist = b.createLinearGradient(0, groundY - H * 0.12, 0, groundY + H * 0.12);
    mist.addColorStop(0, 'rgba(90, 130, 190, 0)');
    mist.addColorStop(0.48, 'rgba(105, 145, 205, 0.09)');
    mist.addColorStop(0.55, 'rgba(35, 58, 95, 0.08)');
    mist.addColorStop(1, 'rgba(2, 4, 10, 0)');
    b.fillStyle = mist;
    b.fillRect(0, groundY - H * 0.12, W, H * 0.24);

    // Zemin düzlemi
    const floorG = b.createLinearGradient(0, groundY - H * 0.01, 0, H);
    floorG.addColorStop(0, 'rgba(12, 22, 40, 0.88)');
    floorG.addColorStop(0.28, 'rgba(6, 11, 22, 0.96)');
    floorG.addColorStop(1, '#010206');
    b.fillStyle = floorG;
    b.fillRect(0, groundY - H * 0.01, W, H - groundY + H * 0.02);

    // 5) Gerçekçi yıldız alanı (üst gökyüzü, ince noktasal)
    const ns = Math.round(W * H / 2800);
    for (let i = 0; i < ns; i++) {
      const y = Math.pow(Math.random(), 1.55) * (groundY - H * 0.05);
      const x = Math.random() * W;
      const distFade = clamp(1 - y / groundY, 0.15, 1);
      const col = pick(['255,255,255', '210,228,255', '255,244,224', '190,215,255']);
      b.fillStyle = `rgba(${col},${rnd(0.1, 0.6) * distFade})`;
      const r = Math.random() < 0.9 ? rnd(0.4, 0.85) : rnd(0.9, 1.35);
      b.beginPath(); b.arc(x, y, r, 0, Math.PI * 2); b.fill();
    }

    // 5.5) Uzak, çok zarif gerçekçi hilal ay (sol üst gökyüzünü dengeler)
    const mr = clamp(Math.min(W, H) * 0.036, 18, 34);
    const mx = W * (layout === 'side' ? 0.13 : 0.16), my = H * (layout === 'side' ? 0.16 : 0.11);
    const mHalo = b.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 6.5);
    mHalo.addColorStop(0, 'rgba(205, 222, 255, 0.18)');
    mHalo.addColorStop(0.35, 'rgba(140, 175, 235, 0.07)');
    mHalo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    b.fillStyle = mHalo;
    b.fillRect(mx - mr * 6.5, my - mr * 6.5, mr * 13, mr * 13);
    // hilal katmanı
    const mc = document.createElement('canvas');
    const ms = Math.ceil(mr * 3);
    mc.width = ms; mc.height = ms;
    const mctx = mc.getContext('2d');
    const mg = mctx.createRadialGradient(ms / 2 - mr * 0.35, ms / 2 - mr * 0.25, mr * 0.1, ms / 2, ms / 2, mr);
    mg.addColorStop(0, 'rgba(255, 252, 240, 0.92)');
    mg.addColorStop(0.7, 'rgba(222, 232, 248, 0.8)');
    mg.addColorStop(1, 'rgba(170, 190, 225, 0.6)');
    mctx.fillStyle = mg;
    mctx.beginPath(); mctx.arc(ms / 2, ms / 2, mr, 0, Math.PI * 2); mctx.fill();
    // gerçekçi gölge kesimi (hilal)
    mctx.globalCompositeOperation = 'destination-out';
    mctx.beginPath(); mctx.arc(ms / 2 + mr * 0.44, ms / 2 - mr * 0.18, mr * 0.92, 0, Math.PI * 2); mctx.fill();
    // hafif dünya ışığı (earthshine)
    b.fillStyle = 'rgba(155, 178, 220, 0.05)';
    b.beginPath(); b.arc(mx, my, mr * 0.98, 0, Math.PI * 2); b.fill();
    b.drawImage(mc, mx - ms / 2, my - ms / 2);

    // 6) Parlayan yıldızlar
    twinkles = [];
    for (let i = 0; i < 48; i++) twinkles.push({
      x: Math.random() * W,
      y: Math.pow(Math.random(), 1.5) * (groundY - H * 0.08),
      s: rnd(0.75, 1.45), ph: Math.random() * 6.28, sp: rnd(0.7, 2.0),
      col: pick(['255,255,255', '215,232,255', '255,238,205'])
    });

    // 7) Sinematik derinlikli bokeh küreleri (arka planda yumuşak ışık topları)
    bokeh = [];
    const bokehCols = [
      '255, 206, 115', '255, 185, 95', '125, 185, 255',
      '235, 115, 130', '165, 225, 210', '255, 235, 185'
    ];
    const nb = isMobile ? 14 : Math.round(clamp(W / 50, 18, 30));
    for (let i = 0; i < nb; i++) {
      const large = i < nb * 0.35;
      bokeh.push({
        x: Math.random() * W,
        y: rnd(H * 0.05, groundY + H * 0.06),
        r: large ? rnd(34, 78) : rnd(10, 26),
        a: large ? rnd(0.03, 0.07) : rnd(0.045, 0.11),
        vx: rnd(-3, 3), vy: rnd(-2.5, 2.5),
        ph: Math.random() * 6.28, sp: rnd(0.35, 0.95),
        col: pick(bokehCols)
      });
    }

    // 8) Sinematik vinyet + tek seferlik hafif 35mm film greni
    const vig = b.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.3, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.7, 'rgba(0,0,0,0.18)');
    vig.addColorStop(1, 'rgba(0,0,0,0.62)');
    b.fillStyle = vig;
    b.fillRect(0, 0, W, H);
    const gp = b.createPattern(grainCanvas, 'repeat');
    if (gp) { b.fillStyle = gp; b.fillRect(0, 0, W, H); }
  }

  function drawSkyFx(sec, dt, t, fade) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 1) İpeksi, zengin kuzey ışığı (aurora) perdeleri — sağ gökyüzüne de zarifçe uzanan dalga
    for (let k = 0; k < 3; k++) {
      const base = H * (0.11 + k * 0.065);
      const amp = H * (k === 1 ? 0.042 : 0.052);
      const col = k === 0 ? '60, 215, 185' : (k === 1 ? '100, 175, 248' : '155, 110, 240');
      const g = ctx.createLinearGradient(0, base - H * 0.14, W * 0.15, base + H * 0.22);
      g.addColorStop(0, `rgba(${col}, 0)`);
      g.addColorStop(0.32, `rgba(${col}, ${k === 0 ? 0.095 : 0.068})`);
      g.addColorStop(0.68, `rgba(${col}, ${k === 0 ? 0.04 : 0.028})`);
      g.addColorStop(1, `rgba(${col}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 20) {
        const rightDip = (k === 2 ? Math.max(0, (x - W * 0.45) / (W * 0.55)) * H * 0.14 : 0);
        const y = base + rightDip + Math.sin(x * 0.0024 + sec * 0.2 + k * 1.9) * amp + Math.cos(x * 0.0052 - sec * 0.24) * amp * 0.42;
        x ? ctx.lineTo(x, y - H * 0.11) : ctx.moveTo(x, y - H * 0.11);
      }
      for (let x = W; x >= 0; x -= 20) {
        const rightDip = (k === 2 ? Math.max(0, (x - W * 0.45) / (W * 0.55)) * H * 0.14 : 0);
        const y = base + rightDip + Math.sin(x * 0.0024 + sec * 0.2 + k * 1.9 + 0.55) * amp;
        ctx.lineTo(x, y + H * 0.16);
      }
      ctx.closePath();
      ctx.fill();
    }

    // 2) Yumuşak bokeh küreleri (hızlı sprite)
    for (const o of bokeh) {
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = groundY + o.r;
      if (o.y > groundY + H * 0.12 + o.r) o.y = -o.r;
      const pulse = 0.65 + 0.35 * Math.sin(sec * o.sp + o.ph);
      ctx.globalAlpha = o.a * pulse * 1.1;
      ctx.drawImage(getGlow(o.col), o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
    }
    ctx.globalAlpha = 1;

    // 3) Ağacın zemine düşen sıcak yansıması (ağaç büyüdükçe güçlenir)
    if (t > 2.2) {
      const treeCx = offX + cols * cellW / 2;
      const grow = clamp((t - 2.2) / 4.5, 0, 1) * fade;
      const rw = cols * cellW * 0.62;
      const rh = Math.max(45, H * 0.09);
      ctx.save();
      ctx.translate(treeCx, groundY + rh * 0.25);
      ctx.scale(1, rh / rw);
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, rw);
      rg.addColorStop(0, `rgba(255, 198, 105, ${0.14 * grow})`);
      rg.addColorStop(0.45, `rgba(55, 165, 100, ${0.09 * grow})`);
      rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, rw, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 4) İnce parlayan yıldızlar
    for (const s of twinkles) {
      const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(sec * s.sp + s.ph));
      ctx.fillStyle = `rgba(${s.col}, ${a * 0.85})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 0.65, 0, Math.PI * 2); ctx.fill();
    }

    // 5) Zarif kayan yıldız
    if (!shooting && Math.random() < dt * 0.09) {
      shooting = { x: rnd(W * 0.12, W * 0.78), y: rnd(H * 0.04, H * 0.24), vx: rnd(520, 760), vy: rnd(140, 260), life: 0 };
    }
    if (shooting) {
      const s = shooting; s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const a = Math.max(0, 1 - s.life / 0.95);
      const tail = 0.14;
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * tail, s.y - s.vy * tail);
      g.addColorStop(0, `rgba(255, 250, 235, ${a * 0.9})`);
      g.addColorStop(1, 'rgba(255, 250, 235, 0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.25;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * tail, s.y - s.vy * tail); ctx.stroke();
      if (a <= 0) shooting = null;
    }

    ctx.restore();
  }

  // ------------------------------------------------------------ Eslem yazısı (DOM katmanı)
  const NAME_T = 11.4;
  let ctaShown = false;

  function positionTitleOverlay() {
    const ov = document.getElementById('titleOverlay');

    const ts = document.getElementById('tSub');

    ov.classList.remove('side', 'bottom');

  function drawTitle(t, sec) {
    if (t < NAME_T) return;
    if (!ctaShown) {
      ctaShown = true;
      positionTitleOverlay();
      document.getElementById('titleOverlay').classList.add('show');
    }
    // metni çevreleyen hafif yıldız parçacıkları
    const p = clamp((t - NAME_T) / 1.8, 0, 1);
    const cx = layout === 'side' ? sideFree * 0.5 : W / 2;
    const cy = layout === 'side' ? H * 0.47 : Math.min(H - 130, titleAnchorY + 62);
    const rx = layout === 'side' ? Math.min(sideFree * 0.4, 155) : Math.min(W * 0.44, 165);
    const ry = layout === 'side' ? 105 : 70;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sc = isMobile ? 6 : 10;
    for (let i = 0; i < sc; i++) {
      const a = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(sec * 2.1 + i * 1.7))) * p;
      const ang = i * 2.39 + 0.3;
      const sx = cx + Math.cos(ang) * rx;
      const sy = cy + Math.sin(ang) * ry;
      const r = (i % 3 === 0 ? 4.2 : 2.8) * a;
      ctx.fillStyle = `rgba(255, 236, 185, ${a * 0.85})`;
      ctx.beginPath();
      ctx.moveTo(sx, sy - r * 2); ctx.lineTo(sx + r * 0.25, sy - r * 0.25); ctx.lineTo(sx + r * 2, sy);
      ctx.lineTo(sx + r * 0.25, sy + r * 0.25); ctx.lineTo(sx, sy + r * 2); ctx.lineTo(sx - r * 0.25, sy + r * 0.25);
      ctx.lineTo(sx - r * 2, sy); ctx.lineTo(sx - r * 0.25, sy - r * 0.25); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // --------------------------------------------------- 3B spiral + fişek + ses
  const orbiters = [];
  for (let i = 0; i < 44; i++) {
    orbiters.push({
      u: i / 44,
      ang: i * 0.42,
      sp: rnd(0.55, 0.85),
      sz: rnd(1.5, 3.2),
      ph: Math.random() * 6.28,
      col: i % 5 === 0 ? '255,245,215' : (i % 7 === 0 ? '170,225,255' : '255,208,108')
    });
  }

  function drawOrbiters(sec, dt, t, fade, front) {
    if (!unlocked || t < 4.4) return;
    const appear = clamp((t - 4.4) / 2.2, 0, 1) * fade;
    const treeCx = offX + cols * cellW / 2;
    const scaleY = (rows * cellH) / VH;
    const scaleX = (cols * cellW) / VW;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const limit = isMobile ? 24 : orbiters.length;
    for (let i = 0; i < limit; i++) {
      const o = orbiters[i];
      if (!front) {
        o.u = (o.u + dt * 0.055) % 1;
        o.ang += dt * o.sp * 1.4;
      }
      const depth = Math.sin(o.ang);
      if (front ? depth < 0 : depth >= 0) continue;
      const vy = BOT - o.u * (BOT - TOP + 20);
      const rad = (hwAt(clamp(vy, TOP, BOT)) + 26) * scaleX;
      const x = treeCx + Math.cos(o.ang) * rad;
      const y = offY + vy * scaleY + depth * 12 * scaleY;
      const edgeFade = Math.sin(o.u * Math.PI);
      const tw = 0.55 + 0.45 * Math.sin(sec * 3.5 + o.ph);
      const a = appear * edgeFade * tw * (front ? 0.85 : 0.35);
      const r = o.sz * (front ? 1.25 : 0.85) * 3.8;
      ctx.globalAlpha = a;
      ctx.drawImage(getGlow(o.col), x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  // ------------------------------------------------ dilek fenerleri + korlar
  const lanterns = [], embers = [];
  function initFestive() {
    lanterns.length = 0;
    const nl = isMobile ? 9 : 14;
    for (let i = 0; i < nl; i++) lanterns.push(makeLantern(true));
    embers.length = 0;
    const ne = isMobile ? 16 : 30;
    for (let i = 0; i < ne; i++) embers.push(makeEmber(true));
  }
  function makeLantern(anyY) {
    const z = Math.random();
    return {
      x: Math.random() * W,
      y: anyY ? rnd(H * 0.08, groundY) : groundY + rnd(10, 60),
      vy: 6 + z * 11, amp: rnd(8, 22), ph: Math.random() * 6.28, fr: rnd(0.2, 0.5),
      s: 4.5 + z * 6.5, a: 0.28 + z * 0.45
    };
  }
  function makeEmber(anyY) {
    const treeCx = offX + cols * cellW / 2;
    return {
      x: treeCx + rnd(-cols * cellW * 0.42, cols * cellW * 0.42),
      y: anyY ? rnd(offY, groundY) : groundY - rnd(0, 40),
      vy: rnd(14, 34), vx: rnd(-10, 10), ph: Math.random() * 6.28,
      s: rnd(1.0, 2.3), a: rnd(0.3, 0.8),
      col: Math.random() < 0.7 ? '255,212,115' : '255,165,120'
    };
  }
  function drawLanterns(sec, dt, t) {
    const vis = unlocked ? clamp((t - 1.5) / 3.0, 0.2, 1) : 0.35;
    const haloSp = getGlow('255,180,80');
    ctx.save();
    for (const l of lanterns) {
      l.y -= l.vy * dt;
      if (l.y < -30) Object.assign(l, makeLantern(false));
      const x = l.x + Math.sin(sec * l.fr + l.ph) * l.amp;
      const flick = 0.85 + 0.15 * Math.sin(sec * 5.2 + l.ph);
      const a = l.a * vis * flick;
      const hr = l.s * 3.8;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * 0.65;
      ctx.drawImage(haloSp, x - hr, l.y - hr, hr * 2, hr * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffcf73';
      ctx.beginPath();
      ctx.ellipse(x, l.y, l.s * 0.52, l.s * 0.74, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff5d0';
      ctx.beginPath();
      ctx.arc(x, l.y + l.s * 0.2, l.s * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawEmbers(sec, dt, t) {
    if (!unlocked || t < 3.0) return;
    const vis = clamp((t - 3.0) / 3.0, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const e of embers) {
      e.y -= e.vy * dt;
      e.x += (e.vx + Math.sin(sec * 1.4 + e.ph) * 14) * dt;
      if (e.y < offY - 20) Object.assign(e, makeEmber(false));
      const tw = 0.5 + 0.5 * Math.sin(sec * 4.5 + e.ph);
      const r = e.s * 3;
      ctx.globalAlpha = e.a * vis * tw;
      ctx.drawImage(getGlow(e.col), e.x - r, e.y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  let skyFlash = 0, nextAutoFw = 16.5;

  // Anamorfik sinema lens parlaması
  function drawAnamorphicFlare(x, y, w, alpha, tint) {
    if (alpha <= 0.005) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // yatay uzun anamorfik çizgi (dış buz mavisi / altın hare)
    const g1 = ctx.createLinearGradient(x - w, y, x + w, y);
    g1.addColorStop(0, `rgba(${tint},0)`);
    g1.addColorStop(0.35, `rgba(${tint},${alpha * 0.25})`);
    g1.addColorStop(0.5, `rgba(255,248,225,${alpha * 0.85})`);
    g1.addColorStop(0.65, `rgba(${tint},${alpha * 0.25})`);
    g1.addColorStop(1, `rgba(${tint},0)`);
    ctx.fillStyle = g1;
    ctx.fillRect(x - w, y - 1.2, w * 2, 2.4);
    // yumuşak geniş bant
    const g2 = ctx.createLinearGradient(x - w * 0.7, y, x + w * 0.7, y);
    g2.addColorStop(0, `rgba(${tint},0)`);
    g2.addColorStop(0.5, `rgba(${tint},${alpha * 0.22})`);
    g2.addColorStop(1, `rgba(${tint},0)`);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.7, 9, 0, 0, Math.PI * 2); ctx.fill();
    // ince lens yansıma halkaları (ghosts)
    const dx = W * 0.5 - x, dy = H * 0.5 - y;
    [[0.45, 22, 0.08], [1.15, 36, 0.05]].forEach(([m, r, a]) => {
      const gx = x + dx * m, gy = y + dy * m;
      const rg = ctx.createRadialGradient(gx, gy, r * 0.4, gx, gy, r);
      rg.addColorStop(0, `rgba(${tint},0)`);
      rg.addColorStop(0.8, `rgba(${tint},${alpha * a})`);
      rg.addColorStop(1, `rgba(${tint},0)`);
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  // Donmuş göl / buz yansıması (ağacın ters, yumuşak yansıması)
  function drawIceReflection(sec) {
    if (!unlocked) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, groundY - 4, W, H - groundY + 4);
    ctx.clip();
    // ters çevrilmiş yumuşak yansıma
    ctx.translate(0, groundY * 2 + 6);
    ctx.scale(1, -0.38);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.globalAlpha = 0.38;
    ctx.drawImage(bloomA, Math.sin(sec * 0.7) * 2.5, 0, W, H);
    ctx.globalAlpha = 0.24;
    ctx.drawImage(bloomB, -Math.sin(sec * 0.5) * 3, 0, W, H);
    ctx.restore();

    // buz yüzeyi ince ışık parıltı çizgileri + aşağı doğru yumuşak sönüm
    ctx.save();
    const fadeG = ctx.createLinearGradient(0, groundY, 0, H);
    fadeG.addColorStop(0, 'rgba(3,6,14,0)');
    fadeG.addColorStop(0.55, 'rgba(2,4,10,0.62)');
    fadeG.addColorStop(1, 'rgba(1,2,6,0.94)');
    ctx.fillStyle = fadeG;
    ctx.fillRect(0, groundY, W, H - groundY);
    // buzda yatay mikro parıltılar (hızlı)
    ctx.globalCompositeOperation = 'lighter';
    const treeCx = offX + cols * cellW / 2;
    const shimmerSp = getGlow('255,225,165');
    for (let i = 0; i < 6; i++) {
      const yy = groundY + 10 + i * ((H - groundY) / 8);
      const ww = cols * cellW * (0.46 - i * 0.05) * (0.88 + 0.12 * Math.sin(sec * 1.3 + i));
      if (ww <= 12) continue;
      ctx.globalAlpha = (1 - i / 6) * 0.1;
      ctx.drawImage(shimmerSp, treeCx - ww + Math.sin(sec * 0.9 + i * 1.7) * 8, yy - 1.5, ww * 2, 3);
    }
    ctx.restore();

  // Zeminde ağır akan kış sisi (hızlı sprite)
  function drawGroundFog(sec) {

    ctx.globalCompositeOperation = 'lighter';
    const nf = isMobile ? 2 : 3;
    for (let i = 0; i < nf; i++) {

      const ry = 36 + i * 16;
