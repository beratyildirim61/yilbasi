  const fireworks = [], fwParticles = [], fwSmokes = [], fwFlares = [], sparks = [];
  const FW_PAL = [
    ['255,220,125', '255,248,210'],
    ['255,165,180', '255,230,210'],
    ['150,215,255', '235,248,255'],
    ['135,240,185', '230,255,240'],
    ['255,190,110', '255,120,130'],
    ['225,185,255', '255,235,205']
  ];

  function launchFirework(tx, ty, big) {
    const sx = tx + rnd(-70, 70);
    const sy = H + 10;
    const dist = Math.hypot(tx - sx, ty - sy);
    const dur = clamp(dist / 880, 0.48, 0.9);
    fireworks.push({ sx, sy, tx, ty, x: sx, y: sy, t: 0, dur, pal: pick(FW_PAL), trail: [], big: !!big });
  }

  function burstFirework(x, y, pal, big) {
    const count = big ? 90 : 64;
    const scale = big ? 1.32 : 1.0;
    skyFlash = Math.min(0.24, skyFlash + (big ? 0.15 : 0.08));
    fwSmokes.push({ x, y, r: big ? 38 : 26, life: 0, max: rnd(2.8, 4.2), col: pal[0] });
    if (big) fwFlares.push({ x, y, life: 0, max: 0.65, col: pal[0] });
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + rnd(-0.07, 0.07);
      const ring = i % 3 === 0 ? 0.56 : 1.0;
      const sp = rnd(65, 245) * ring * scale;
      fwParticles.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: rnd(1.3, 2.5),
        col: ring < 1 ? pal[1] : pal[0],
        sz: rnd(1.3, 2.7), glitter: Math.random() < 0.45, willow: big && ring === 1,
        crackle: big && i % 9 === 0
      });
    }
    playBoom(big);
    playChime();
  }

  function launchGrandSalvo() {
    const shots = [
      [0.20, 0.24, false, 0],
      [0.80, 0.22, false, 320],
      [0.32, 0.16, true,  720],
      [0.70, 0.17, true,  1080],
      [0.50, 0.14, true,  1520],
      [0.16, 0.30, false, 1880],
      [0.84, 0.28, false, 2040]
    ];
    shots.forEach(([rx, ry, big, delay]) => setTimeout(() => {
      if (unlocked) launchFirework(W * rx, H * ry, big);
    }, delay));
  }

  function updateFireworks(dt, sec, wind) {
    ctx.save();
    // gerçekçi patlama dumanları (önce yumuşakça çizilir)
    for (let i = fwSmokes.length - 1; i >= 0; i--) {
      const s = fwSmokes[i];
      s.life += dt;
      if (s.life >= s.max) { fwSmokes.splice(i, 1); continue; }
      s.x += wind * dt * 0.45; s.y -= 6 * dt;
      const k = s.life / s.max;
      const rad = s.r * (1 + k * 2.4);
      const a = (1 - k) * (1 - k) * 0.11;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad);
      g.addColorStop(0, `rgba(${s.col},${a * 0.7})`);
      g.addColorStop(0.5, `rgba(170,185,215,${a * 0.45})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    if (skyFlash > 0.002) {
      skyFlash = Math.max(0, skyFlash - dt * 0.45);
      const fg = ctx.createRadialGradient(W * 0.5, H * 0.25, 0, W * 0.5, H * 0.25, Math.max(W, H) * 0.65);
      fg.addColorStop(0, `rgba(255,225,165,${skyFlash})`);
      fg.addColorStop(1, 'rgba(255,225,165,0)');
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
    }
    for (let i = fwFlares.length - 1; i >= 0; i--) {
      const fl = fwFlares[i];
      fl.life += dt;
      if (fl.life >= fl.max) { fwFlares.splice(i, 1); continue; }
      const k = 1 - fl.life / fl.max;
      drawAnamorphicFlare(fl.x, fl.y, 170 * (0.6 + 0.5 * k), k * k * 0.7, fl.col);
    }
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i];
      f.t += dt;
      const p = clamp(f.t / f.dur, 0, 1);
      const ease = 1 - Math.pow(1 - p, 2.4);
      f.x = f.sx + (f.tx - f.sx) * ease + Math.sin(p * Math.PI) * wind * 0.25;
      f.y = f.sy + (f.ty - f.sy) * ease;
      f.trail.push([f.x, f.y]);
      if (f.trail.length > 14) f.trail.shift();
      for (let j = 1; j < f.trail.length; j++) {
        const a = j / f.trail.length;
        ctx.strokeStyle = `rgba(${f.pal[0]},${a * 0.8})`;
        ctx.lineWidth = a * (f.big ? 2.8 : 2.2);
        ctx.beginPath();
        ctx.moveTo(f.trail[j - 1][0], f.trail[j - 1][1]);
        ctx.lineTo(f.trail[j][0], f.trail[j][1]);
        ctx.stroke();
      }
      if (p >= 1) {
        burstFirework(f.tx, f.ty, f.pal, f.big);
        fireworks.splice(i, 1);
      }
    }
    for (let i = fwParticles.length - 1; i >= 0; i--) {
      const p = fwParticles[i];
      p.life += dt;
      if (p.life >= p.max) {
        if (p.crackle) {
          for (let c = 0; c < 4; c++) {
            const ca = Math.random() * 6.28, cs = rnd(25, 65);
            fwParticles.push({
              x: p.x, y: p.y, px: p.x, py: p.y,
              vx: Math.cos(ca) * cs, vy: Math.sin(ca) * cs,
              life: 0, max: rnd(0.25, 0.45), col: '255,250,235',
              sz: 1.4, glitter: true, willow: false, crackle: false
            });
          }
        }
        fwParticles.splice(i, 1); continue;
      }
      p.px = p.x; p.py = p.y;
      const drag = p.willow ? 0.18 : 0.25;
      p.vx = p.vx * Math.pow(drag, dt) + wind * dt * 0.35;
      p.vy = p.vy * Math.pow(drag, dt) + (p.willow ? 72 : 52) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = 1 - p.life / p.max;
      const flick = p.glitter ? (0.35 + 0.65 * Math.sin(sec * 26 + i)) : 1;
      const a = k * k * flick;
      ctx.strokeStyle = `rgba(${p.col},${a * 0.9})`;
      ctx.lineWidth = p.sz * k;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = `rgba(255,252,240,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * 0.72 * k, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { sparks.splice(i, 1); continue; }
      s.vx *= Math.pow(0.35, dt);
      s.vy += 38 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const a = (1 - s.life / s.max);
      const r = s.sz * a;
      ctx.fillStyle = `rgba(${s.col},${a * 0.9})`;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - r * 2.2); ctx.lineTo(s.x + r * 0.35, s.y - r * 0.35);
      ctx.lineTo(s.x + r * 2.2, s.y); ctx.lineTo(s.x + r * 0.35, s.y + r * 0.35);
      ctx.lineTo(s.x, s.y + r * 2.2); ctx.lineTo(s.x - r * 0.35, s.y + r * 0.35);
      ctx.lineTo(s.x - r * 2.2, s.y); ctx.lineTo(s.x - r * 0.35, s.y - r * 0.35);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function addSparks(x, y, n) {
    for (let i = 0; i < n; i++) {
      sparks.push({
        x: x + rnd(-4, 4), y: y + rnd(-4, 4),
        vx: rnd(-28, 28), vy: rnd(-35, 10),
        life: 0, max: rnd(0.45, 0.95),
        sz: rnd(1.5, 3.2),
        col: Math.random() < 0.7 ? '255,222,135' : '215,235,255'
      });
    }
    if (sparks.length > 180) sparks.splice(0, sparks.length - 180);
  }

  // ---- Müzik kutusu (Web Audio API) ----
  let audioCtx = null, musicOn = false, musicTimer = null, noteIdx = 0;
  // "We Wish You a Merry Christmas" müzik kutusu dizisi [frekans, vuruş]
  const MELODY = [
    [392,1],[523.25,1],[523.25,.5],[587.33,.5],[523.25,.5],[493.88,.5],
    [440,1],[440,1],[440,1],[587.33,1],[587.33,.5],[659.25,.5],[587.33,.5],[523.25,.5],
    [493.88,1],[392,1],[392,1],[659.25,1],[659.25,.5],[698.46,.5],[659.25,.5],[587.33,.5],
    [523.25,1],[440,1],[392,.5],[392,.5],[440,1],[587.33,1],[493.88,1],[523.25,2.2]
  ];
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBell(freq, vol, dur) {
    if (!audioCtx || !musicOn) return;
    const now = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    g.connect(audioCtx.destination);
    const o1 = audioCtx.createOscillator();
    o1.type = 'sine'; o1.frequency.setValueAtTime(freq, now);
    const o2 = audioCtx.createOscillator();
    o2.type = 'triangle'; o2.frequency.setValueAtTime(freq * 2, now);
    const g2 = audioCtx.createGain(); g2.gain.value = 0.14;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(now); o2.start(now);
    o1.stop(now + dur + 0.05); o2.stop(now + dur + 0.05);
  }
  function playBoom(big) {
    if (!audioCtx || !musicOn) return;
    const now = audioCtx.currentTime;
    // uzak yumuşak bas patlama sesi
    const dur = big ? 0.55 : 0.35;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.setValueAtTime(big ? 220 : 180, now);
    flt.frequency.exponentialRampToValueAtTime(55, now + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(big ? 0.14 : 0.08, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }
  function playChime() {
    if (!audioCtx || !musicOn) return;
    const base = pick([1046.5, 1174.66, 1318.5, 1567.98]);
    playBell(base, 0.035, 0.85);
    setTimeout(() => playBell(base * 1.25, 0.022, 0.7), 65);
  }
  function playPad(freqs, dur) {
    if (!audioCtx || !musicOn) return;
    const now = audioCtx.currentTime;
    freqs.forEach(freq => {
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.012, now + 0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      g.connect(audioCtx.destination);
      const o = audioCtx.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(freq, now);
      o.connect(g); o.start(now); o.stop(now + dur + 0.1);
    });
  }
  const CHORDS = [
    [130.81, 196.00, 261.63], // C
    [174.61, 220.00, 261.63], // F
    [146.83, 220.00, 293.66], // Dm
    [196.00, 246.94, 293.66]  // G
  ];
  function scheduleNote() {
    if (!musicOn) return;
    const [f, beats] = MELODY[noteIdx % MELODY.length];
    if (noteIdx % 6 === 0) playPad(CHORDS[((noteIdx / 6) | 0) % CHORDS.length], 2.9);
    noteIdx++;
    playBell(f, 0.055, 1.4);
    if (noteIdx % 3 === 1) playBell(f * 0.5, 0.025, 1.85);
    musicTimer = setTimeout(scheduleNote, beats * 430);
  }
  function setMusic(on) {
    musicOn = on;
    const btn = document.getElementById('btnMusic');
    btn.querySelector('span').textContent = on ? 'Müzik' : 'Sessiz';
    btn.querySelector('.wave').style.opacity = on ? '1' : '0.2';
    clearTimeout(musicTimer);
    if (on) { ensureAudio(); scheduleNote(); }
  }

  let unlocked = false, finaleFired = false;

  // ------------------------------------------------------------------ döngü
  function frame(now) {
    if (W !== window.innerWidth || H !== window.innerHeight) { resize(); initFestive(); }
    const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
    const sec = now / 1000;
    // Tekrar düğmesine basılmadıkça baştan başlamaz!
    const t = unlocked ? (now - start) / 1000 : 0;
    lastT = t;

    if (unlocked) {
      const doTwinkle = (now - lastTwinkleMs) > (isMobile ? 55 : 40);
      if (doTwinkle) lastTwinkleMs = now;
      const list = treeAllBuilt ? (doTwinkle ? animCells : null) : cells;
      if (list) {
        sctx.textBaseline = 'top';
        sctx.font = `bold ${fs}px Menlo, Consolas, "Courier New", monospace`;
        let anyUpdated = false;
        for (let ci = 0; ci < list.length; ci++) {
          const cell = list[ci];
          const st = cell.stack;
          let idx = -1;
          for (let i = st.length - 1; i >= 0; i--) if (t >= st[i].t0) { idx = i; break; }
          const e = idx >= 0 ? st[idx] : null;
          const age = e ? t - e.t0 : 9;
          const flashing = age < 0.22;
          let dirty = idx !== cell.cur || flashing || cell.fl || (e && e.tw && doTwinkle);
          if (e && e.flick && doTwinkle && Math.random() < 0.004) { e.ch = pick(RAMP.tree.slice(6)); dirty = true; }
          if (!dirty) continue;
          anyUpdated = true;
          cell.cur = idx; cell.fl = flashing;
          sctx.clearRect(cell.px, cell.py, cellW + 0.6, cellH + 0.6);
          if (!e) continue;
          let fg = e.fg, bg = e.bg;
          if (e.tw || flashing) {
            let k = e.lay === 'ground' ? 1.05 : 1.22, kb = 0.26;
            if (e.tw) { const s = 1 + e.tw * Math.sin(sec * e.sp + e.ph); k *= s; kb *= s; }
            let r = e.r * k, g = e.g * k, b = e.b * k;
            if (flashing) {
              const f = 1 - age / 0.22;
              r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; kb += 0.4 * f;
            }
            if (e.lay === 'ground') {
              fg = `rgba(${clamp(r, 0, 255) | 0},${clamp(g, 0, 255) | 0},${clamp(b, 0, 255) | 0},${(e.ga * 0.92).toFixed(2)})`;
              bg = e.ga > 0.45 ? `rgba(${clamp(e.r * kb, 0, 255) | 0},${clamp(e.g * kb, 0, 255) | 0},${clamp(e.b * kb, 0, 255) | 0},${((e.ga - 0.45) * 0.55).toFixed(2)})` : null;
            } else {
              fg = `rgb(${clamp(r, 0, 255) | 0},${clamp(g, 0, 255) | 0},${clamp(b, 0, 255) | 0})`;
              bg = `rgb(${clamp(e.r * kb, 0, 255) | 0},${clamp(e.g * kb, 0, 255) | 0},${clamp(e.b * kb, 0, 255) | 0})`;
            }
          }
          if (bg) {
            sctx.fillStyle = bg;
            sctx.fillRect(cell.px, cell.py, cellW + 0.6, cellH + 0.6);
          }
          sctx.fillStyle = fg;
          sctx.fillText(e.ch, cell.px, cell.py);
        }
        if (anyUpdated) sceneDirty = true;
        if (!treeAllBuilt && t > 13.8) treeAllBuilt = true;
      }

      if (!finaleFired && t >= NAME_T) {
        finaleFired = true;
        launchGrandSalvo();
        nextAutoFw = t + 5.2;
      }
      if (finaleFired && t >= nextAutoFw) {
        nextAutoFw = t + rnd(4.2, 6.8);
        const side = Math.random() < 0.5 ? rnd(0.14, 0.34) : rnd(0.68, 0.88);
        launchFirework(W * side, H * rnd(0.15, 0.32), Math.random() < 0.35);
      }
    }

    // filmsel kamera yaklaşması (dolly-in) + 3B paralaks + kış rüzgarı
    const camP = unlocked ? clamp(t / 12.5, 0, 1) : 0;
    const camEase = 1 - Math.pow(1 - camP, 3);
    const camScale = unlocked ? (0.945 + 0.055 * camEase + 0.004 * Math.sin(sec * 0.35)) : 1;
    parX += (targetParX - parX) * Math.min(1, dt * 3.5);
    parY += (targetParY - parY) * Math.min(1, dt * 3.5);
    const wind = Math.sin(sec * 0.28) * 14 + Math.sin(sec * 0.71) * 7;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(-parX * 8, -parY * 5);
    ctx.drawImage(bgCanvas, -12, -12, W + 24, H + 24);
    drawSkyFx(sec, dt, t, 1);
    ctx.restore();

    ctx.save();
    ctx.translate(-parX * 4, -parY * 3);
    drawLanterns(sec, dt, t);
    ctx.restore();

    // kamera dönüşümü + paralaks sahne katmanına uygulanır
    ctx.save();
    ctx.translate(W / 2 + parX * 7, H * 0.52 + parY * 4);
    ctx.scale(camScale, camScale);
    ctx.translate(-W / 2, -H * 0.52);

    drawGroundFog(sec);
    drawOrbiters(sec, dt, t, 1, false);

    if (unlocked) {
      if (sceneDirty) {
        const ba = bloomA.getContext('2d'), bb = bloomB.getContext('2d');
        ba.clearRect(0, 0, bloomA.width, bloomA.height);
        ba.drawImage(scene, 0, 0, bloomA.width, bloomA.height);
        bb.clearRect(0, 0, bloomB.width, bloomB.height);
        bb.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);
        sceneDirty = false;
      }

      // donmuş göl / buz yansıması + zemine yumuşak oturtma gölgesi & kar yatağı
      drawIceReflection(sec);
      if (t > 2.0) {
        const treeCx = offX + cols * cellW / 2;
        const bedVis = clamp((t - 2.0) / 1.8, 0, 1);
        ctx.save();
        // geniş temas gölgesi (ağaç ve kutuları zemine oturtur)
        ctx.translate(treeCx, groundY + 12);
        ctx.scale(1, 0.16);
        const sh = ctx.createRadialGradient(0, 0, cols * cellW * 0.1, 0, 0, cols * cellW * 0.52);
        sh.addColorStop(0, `rgba(1, 3, 9, ${0.72 * bedVis})`);
        sh.addColorStop(0.65, `rgba(2, 5, 14, ${0.38 * bedVis})`);
        sh.addColorStop(1, 'rgba(2, 5, 14, 0)');
        ctx.fillStyle = sh;
        ctx.beginPath(); ctx.arc(0, 0, cols * cellW * 0.52, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      ctx.globalAlpha = 1;
      ctx.drawImage(scene, 0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.globalAlpha = 0.22; ctx.drawImage(bloomA, 0, 0, W, H);
      ctx.globalAlpha = 0.36; ctx.drawImage(bloomB, 0, 0, W, H);

      // yıldız halesi + aşağı süzülen altın ışık hüzmesi (god-ray cone) + anamorfik lens parlaması
      if (t > 4.75) {
        const gx = offX + cols * cellW / 2, gy = offY + (92 / VH) * rows * cellH;
        const stAge = t - 4.75;
        const starVis = clamp(stAge / 0.55, 0, 1);
        const pulse = 0.88 + 0.12 * Math.sin(sec * 2.1);

        // 1) Yıldızdan ağacın üst dallarına ve hediye kapaklarına süzülen yumuşak altın ışık konisi
        const coneH = rows * cellH * 0.72;
        const coneW = cols * cellW * 0.44;
        const cg = ctx.createLinearGradient(gx, gy, gx, gy + coneH);
        cg.addColorStop(0, `rgba(255, 224, 128, ${0.24 * starVis * pulse})`);
        cg.addColorStop(0.32, `rgba(255, 208, 105, ${0.11 * starVis * pulse})`);
        cg.addColorStop(0.75, `rgba(255, 195, 95, ${0.045 * starVis * pulse})`);
        cg.addColorStop(1, 'rgba(255, 190, 90, 0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(gx - 10, gy);
        ctx.lineTo(gx + 10, gy);
        ctx.lineTo(gx + coneW, gy + coneH);
        ctx.lineTo(gx - coneW, gy + coneH);
        ctx.closePath();
        ctx.fill();

        // 2) Hediye kutularının üst yüzeylerine düşen canlı sıcak ışık yansımaları
        if (t > 7.5) {
          const gVis = clamp((t - 7.5) / 1.5, 0, 1) * pulse;
          const sx = (cols * cellW) / VW, sy = (rows * cellH) / VH;
          GIFTS.forEach((b, i) => {
            const bx = offX + (b.x + b.w * 0.52) * sx;
            const by = offY + (b.y - b.d * 0.2) * sy;
            const br = b.w * sx * 0.62;
            const bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
            bg.addColorStop(0, `rgba(${b.glow}, ${0.22 * gVis * (0.8 + 0.2 * Math.sin(sec * 2.4 + i))})`);
            bg.addColorStop(1, `rgba(${b.glow}, 0)`);
            ctx.fillStyle = bg;
            ctx.beginPath(); ctx.ellipse(bx, by, br, br * 0.36, 0, 0, Math.PI * 2); ctx.fill();
          });
        }

        const rr = cols * cellW * (0.105 + 0.014 * Math.sin(sec * 2.2));
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
        g.addColorStop(0, 'rgba(255,215,105,.48)'); g.addColorStop(1, 'rgba(255,205,90,0)');
        ctx.globalAlpha = starVis;
        ctx.fillStyle = g; ctx.fillRect(gx - rr, gy - rr, rr * 2, rr * 2);

        // anamorfik lens parlaması (yıldız yanınca güçlü, sonra zarif)
        const burstBoost = stAge < 2.0 ? Math.pow(1 - stAge / 2.0, 2) * 0.55 : 0;
        drawAnamorphicFlare(gx, gy, cols * cellW * (0.36 + burstBoost * 0.3), starVis * (0.42 + burstBoost), '165,215,255');

        // şok dalgası halkası (yıldız yanınca bir kez yayılır)
        if (stAge < 2.2) {
          const sp = stAge / 2.2;
          const sr = cols * cellW * (0.04 + sp * 0.52);
          ctx.strokeStyle = `rgba(255,232,165,${(1 - sp) * (1 - sp) * 0.65})`;
          ctx.lineWidth = (1 - sp) * 3.5;
          ctx.beginPath(); ctx.arc(gx, gy, sr, 0, Math.PI * 2); ctx.stroke();
        }

        // parıltı ışınları
        ctx.save(); ctx.translate(gx, gy); ctx.rotate(sec * 0.14);
        for (let i = 0; i < 12; i++) {
          const len = rr * (i % 2 ? 0.85 : 1.75) * (0.85 + 0.15 * Math.sin(sec * 2.8 + i));
          const lg = ctx.createLinearGradient(0, 0, len, 0);
          lg.addColorStop(0, 'rgba(255,240,180,.55)'); lg.addColorStop(1, 'rgba(255,235,170,0)');
          ctx.fillStyle = lg;
          ctx.beginPath(); ctx.moveTo(0, -1.5); ctx.lineTo(len, 0); ctx.lineTo(0, 1.5); ctx.fill();
          ctx.rotate(Math.PI / 6);
        }
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      drawOrbiters(sec, dt, t, 1, true);
      drawEmbers(sec, dt, t);
    }
    ctx.restore(); // kamera sonu

    if (unlocked) drawTitle(t, sec, 1);
    updateFireworks(dt, sec, wind);

    // kar (derinlikli + rüzgar + ön plan paralaks — hızlı yuvarlak sprite)
    const snowSp = getGlow('242,248,255');
    ctx.save();
    ctx.translate(parX * 14, parY * 8);
    for (const f of snow) {
      f.y += f.vy * dt;
      f.x += (f.vx + wind * (f.soft ? 1.15 : 0.45)) * dt;
      if (f.y > H + 16) Object.assign(f, flake(false));
      if (f.x < -20) f.x = W + 20;
      if (f.x > W + 20) f.x = -20;
      const x = f.x + Math.sin(sec * f.fr + f.ph) * f.amp;
      const r = f.soft ? f.s * 2.3 : f.s * 1.45;
      ctx.globalAlpha = f.soft ? f.a * 0.78 : Math.min(1, f.a * 1.15);
      ctx.drawImage(snowSp, x - r, f.y - r, r * 2, r * 2);
    }
    ctx.restore();
    ctx.restore();
    requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); initFestive(); }, 150); });
  canvas.addEventListener('pointermove', e => {
    targetParX = (e.clientX / W - 0.5) * 2;
    targetParY = (e.clientY / H - 0.5) * 2;
    if (unlocked) addSparks(e.clientX, e.clientY, 2);
  });
  canvas.addEventListener('pointerdown', e => {
    if (!unlocked) return;
    addSparks(e.clientX, e.clientY, 12);
    launchFirework(e.clientX, Math.min(e.clientY, H * 0.68), Math.random() < 0.45);
  });

  document.getElementById('btnMusic').addEventListener('click', () => setMusic(!musicOn));
  document.getElementById('btnFw').addEventListener('click', launchGrandSalvo);
  document.getElementById('btnReplay').addEventListener('click', () => {
    start = performance.now(); lastT = 0; finaleFired = false; ctaShown = false;
    treeAllBuilt = false; sceneDirty = true;
    document.getElementById('titleOverlay').classList.remove('show');
    document.getElementById('giftModal').classList.remove('show');
    buildScene();
    animCells = cells.filter(c => c.stack.some(e => e.tw || e.flick));
  });

  // ---- Hediyeni Aç CTA & Sürpriz Kartı ----
  const giftModal = document.getElementById('giftModal');
  document.getElementById('ctaBtn').addEventListener('click', () => {
    giftModal.classList.add('show');
    // büyülü arp glissando + kutlama fişeği
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => setTimeout(() => playBell(f, 0.05, 1.4), i * 85));
    launchFirework(W * 0.3, H * 0.2, true);
    setTimeout(() => launchFirework(W * 0.72, H * 0.18, true), 260);
  });
  document.getElementById('giftClose').addEventListener('click', () => {
    giftModal.classList.remove('show');
    launchGrandSalvo();
  });
  giftModal.addEventListener('click', e => { if (e.target === giftModal) giftModal.classList.remove('show'); });

  // ---- şifre ekranı ----
  const gate = document.getElementById('gate');
  const input = document.getElementById('pw');
  const msg = document.getElementById('msg');
  const box = document.getElementById('box');
  const vidWrap = document.getElementById('vidWrap');
  const eslemVid = document.getElementById('eslemVid');
  const hud = document.getElementById('hud');
  const hint = document.getElementById('hint');
  function tryUnlock(ev) {
    ev.preventDefault();
    const v = input.value.trim().toLocaleLowerCase('tr-TR');
    if (v === 'berat') {
      eslemVid.pause();
      gate.classList.add('hide');
      setTimeout(() => gate.remove(), 900);
      document.body.classList.add('cinema');
      unlocked = true;
      finaleFired = false;
      start = performance.now() - T_OFFSET * 1000; lastT = 0; lastNow = performance.now();
      hud.classList.add('show');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 6500);
      setMusic(true);
    } else if (v === 'eslem') {
      msg.textContent = '';
      vidWrap.classList.add('show');
      eslemVid.currentTime = 0;
      eslemVid.play().catch(() => {});
    } else {
      eslemVid.pause();
      vidWrap.classList.remove('show');
      msg.textContent = 'Kurulduğunu biliyorum ama doğru cevabın o olmadığını sen de biliyorsun';
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      input.select();
    }
  }
  document.getElementById('form').addEventListener('submit', tryUnlock);
  resize();
  initFestive();
  requestAnimationFrame(frame);
  input.focus();
})();
</script>
</body>
</html>
